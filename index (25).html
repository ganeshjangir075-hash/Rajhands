<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5563">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turant">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Turant Grocery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mobile-only app. Full-screen scrolling screen with sticky header, fixed bottom nav and sheets. Desktop browsers get a gate asking them to open it on a phone. */
:root{
  --bg:#EEF3F3; --app:#F7FAFA; --surface:#FFFFFF; --ink:#0E2226; --muted:#5D7175; --line:#E0E9EA;
  --brand:#0A5563; --brand-ink:#FFFFFF; --tint:#E2EFF0; --haldi:#F2A900; --haldi-ink:#3A2A00; --chili:#D2442A; --leaf:#1E8E4E;
  --shadow:0 10px 30px -12px rgba(10,60,70,.28);
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060D0F; --app:#0B1517; --surface:#132225; --ink:#E6F0F1; --muted:#90A4A7; --line:#22363A;
  --brand:#4FC3CF; --brand-ink:#04272D; --tint:#12302F; --haldi:#F5B92E; --haldi-ink:#2A1E00; --chili:#F06A4E; --leaf:#4CC27F;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#060D0F; --app:#0B1517; --surface:#132225; --ink:#E6F0F1; --muted:#90A4A7; --line:#22363A;
  --brand:#4FC3CF; --brand-ink:#04272D; --tint:#12302F; --haldi:#F5B92E; --haldi-ink:#2A1E00; --chili:#F06A4E; --leaf:#4CC27F;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink);font-size:16px}
button,a,[role=button]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

body{overflow:hidden}
.stage{height:100%;height:100dvh}
.device{height:100%}
.viewport{position:relative;height:100%;overflow:hidden;transform:translateZ(0);background:var(--app)}
.screen{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--app);position:relative;padding-bottom:150px}
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding-block:32px;padding-inline:24px;overflow-y:auto;background:radial-gradient(900px 600px at 50% 0%,var(--tint),transparent 70%),var(--bg)}
.gcard{max-width:440px;display:grid;gap:18px;justify-items:center;text-align:center}
.gphone{width:96px;height:96px;border-radius:28px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.gphone svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.gcard h1{font:800 32px/1.08 var(--f-display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.gcard p{margin:0;color:var(--muted);font-size:16px;max-width:38ch}
.gcard ol{margin:4px 0 0;padding:16px 16px 16px 36px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;gap:8px;font-size:14.5px;width:100%}
.wm{display:flex;align-items:center;gap:10px;font:800 26px var(--f-display);letter-spacing:-.02em;color:var(--brand)}
.wm span{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.wm span svg{width:22px;height:22px;fill:var(--haldi);stroke:none}


/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:14px 16px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.hdr-top{display:flex;align-items:center;gap:12px}
.eta{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.eta small{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.addr{display:flex;width:100%;text-align:left;color:inherit;align-items:center;gap:4px;font-size:13px;opacity:.92;margin-top:4px;max-width:100%;min-width:0}
.addr b{font-weight:700}
.addr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{margin-left:auto;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--brand-ink) 18%,transparent);display:grid;place-items:center;font-weight:800}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--muted);border-radius:12px;padding:11px 14px;width:100%;text-align:left}
.search input{border:0;outline:0;background:none;flex:1;min-width:0}
.search .rot{flex:1;overflow:hidden;height:20px}

.wrap{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.wrap>*,section{min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font:800 19px/1.2 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.sec-h button{color:var(--brand);font-weight:700;font-size:13px}

/* banners */
.banners{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.banners::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.bn{flex:0 0 86%;scroll-snap-align:start;border-radius:18px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;text-align:left}
.bn h3{font:800 22px/1.1 var(--f-display);margin:0;max-width:70%;letter-spacing:-.02em}
.bn p{margin:6px 0 0;font-size:13px;max-width:62%;opacity:.85}
.bn .cta{align-self:flex-start;margin-top:12px;background:rgba(0,0,0,.82);color:#fff;font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px}
.bn .art{position:absolute;right:-8px;bottom:-14px;font-size:84px;line-height:1;transform:rotate(-8deg)}
.bn.b1{background:linear-gradient(135deg,#FFD66B,#F29F05);color:#2B1B00}
.bn.b2{background:linear-gradient(135deg,#BFE9D8,#5CC3A0);color:#05301F}
.bn.b3{background:linear-gradient(135deg,#FFC2B0,#F0765A);color:#3B0D02}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.cat{min-width:0;width:100%;grid-template-columns:minmax(0,1fr);display:grid;gap:6px;justify-items:center;text-align:center;font-size:12px;font-weight:600;line-height:1.2}
.cat .ci{width:100%;aspect-ratio:1;max-width:100%;border-radius:16px;display:grid;place-items:center;font-size:34px;background:hsl(var(--h) 60% 90%)}
:root[data-theme="dark"] .cat .ci,:root[data-theme="dark"] .pimg{background:hsl(var(--h) 25% 18%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cat .ci,:root:not([data-theme="light"]) .pimg{background:hsl(var(--h) 25% 18%)}}

/* product */
.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.rail .pc{flex:0 0 148px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;min-width:0}
.pimg{position:relative;border-radius:10px;aspect-ratio:1.15;display:grid;place-items:center;font-size:52px;background:hsl(var(--h) 55% 93%)}
.off{position:absolute;left:6px;top:6px;background:var(--chili);color:#fff;font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;letter-spacing:.02em}
.veg{position:absolute;right:7px;top:7px;width:13px;height:13px;border:1.5px solid var(--leaf);border-radius:2px;display:grid;place-items:center;background:var(--surface)}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--leaf)}
.veg.nv{border-color:var(--chili)}.veg.nv::after{background:var(--chili)}
.oos .pimg{filter:grayscale(1);opacity:.55}
.ptime{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.ptime svg{width:12px;height:12px}
.pname{font-weight:600;font-size:13.5px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pw{font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px}
.price b{display:block;font-size:14px;font-weight:800}
.price s{font-size:11px;color:var(--muted)}
.add{min-width:66px;height:32px;border:1.5px solid var(--brand);color:var(--brand);background:var(--tint);border-radius:9px;font-weight:800;font-size:13px;letter-spacing:.03em;position:relative}
.add small{position:absolute;left:0;right:0;bottom:-15px;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:0}
.add.notify{border-color:var(--line);background:var(--surface);color:var(--muted);font-size:11px}
.step{display:flex;align-items:center;height:32px;min-width:66px;background:var(--brand);color:var(--brand-ink);border-radius:9px;font-weight:800;overflow:hidden}
.step button{width:24px;height:100%;font-size:17px;font-weight:800;color:inherit}
.step span{flex:1;text-align:center;font-size:13px;min-width:18px}

/* cart bar & nav */
.fixed{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:30}
.nav{bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.4}
.cartbar{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:0 12px 10px}
.cartbar button{width:100%;display:flex;align-items:center;gap:12px;background:var(--leaf);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);text-align:left}
:root[data-theme="dark"] .cartbar button{color:#04210F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cartbar button{color:#04210F}}
.cartbar .stack{display:flex}
.cartbar .stack span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:17px;margin-left:-8px;border:2px solid var(--leaf)}
.cartbar .stack span:first-child{margin-left:0}
.cartbar .ct{flex:1;line-height:1.2}
.cartbar .ct b{display:block;font-size:14px}
.cartbar .ct small{font-size:12px;opacity:.9}
.cartbar .go{font-weight:800;display:flex;align-items:center;gap:2px}

/* page header (subpages) */
.ph{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
.ph h1{font:800 18px var(--f-display);margin:0;letter-spacing:-.01em;flex:1;min-width:0}
.ph .sub{font-size:12px;color:var(--muted);font-weight:500;display:block;font-family:var(--f-body)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.iconbtn:hover{background:var(--tint)}

/* category page */
.catpage{display:grid;grid-template-columns:84px minmax(0,1fr)}
.side{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:61px;align-self:start;max-height:calc(100dvh - 140px);overflow-y:auto}
.side button{display:grid;justify-items:center;gap:4px;width:100%;padding:10px 4px;font-size:11px;font-weight:600;text-align:center;line-height:1.2;color:var(--muted);border-left:3px solid transparent}
.side button .ci{font-size:26px;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--tint)}
.side button.on{color:var(--ink);border-left-color:var(--brand);background:var(--tint)}
.side button.on .ci{background:var(--surface)}
.catmain{padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--app);border-color:var(--ink)}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{font:800 15px var(--f-display);margin:0 0 10px}
.ci-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci-row:first-of-type{border-top:0;padding-top:0}
.ci-thumb{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-size:28px;background:var(--tint)}
.ci-name{font-weight:600;font-size:13.5px;line-height:1.25}
.ci-w{font-size:12px;color:var(--muted)}
.ci-p{text-align:right;display:grid;gap:6px;justify-items:end}
.ci-p b{font-size:14px}
.ci-p s{font-size:11px;color:var(--muted);margin-right:4px}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);border-radius:6px;transition:width .4s}
.save{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--leaf) 12%,var(--surface));color:var(--leaf);font-weight:700;font-size:13px;border-radius:12px;padding:10px 12px}
.bill{display:grid;gap:8px;font-size:13.5px}
.bill .r{display:flex;justify-content:space-between;gap:12px}
.bill .r span:first-child{color:var(--muted)}
.bill .tot{border-top:1px dashed var(--line);padding-top:10px;font-weight:800;font-size:15px}
.bill .tot span:first-child{color:var(--ink)}
.free{color:var(--leaf);font-weight:700}
.strike{text-decoration:line-through;color:var(--muted);margin-right:6px;font-weight:500}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;width:100%;text-align:left;background:var(--surface)}
.opt.on{border-color:var(--brand);background:var(--tint)}
.opt .rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-left:auto;flex:none}
.opt.on .rad{border:5px solid var(--brand)}
.opt .t{display:grid;line-height:1.25;min-width:0}
.opt .t small{color:var(--muted);font-size:12px}
.paybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.paybar .amt{line-height:1.15}
.paybar .amt b{font-size:18px;display:block}
.paybar .amt small{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn{background:var(--brand);color:var(--brand-ink);font-weight:800;border-radius:12px;padding:13px 18px;flex:1;text-align:center;font-size:15px}
.btn.ghost{background:var(--tint);color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--brand);font-weight:700;font-size:13px}
.coupon-in{display:flex;gap:8px}
.coupon-in input{flex:1;min-width:0;border:1.5px dashed var(--line);background:var(--app);border-radius:10px;padding:10px 12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.applied{display:flex;align-items:center;gap:10px;color:var(--leaf);font-weight:700;font-size:14px}
.applied small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* empty */
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:48px 24px}
.empty .big{font-size:64px}
.empty h2{font:800 20px var(--f-display);margin:0}
.empty p{color:var(--muted);margin:0;max-width:30ch}

/* tracking */
.track-hero{background:var(--brand);color:var(--brand-ink);padding:18px 16px 22px;display:grid;gap:4px}
.track-hero .lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.track-hero .big{font:800 44px/1 var(--f-display);letter-spacing:-.03em}
.track-hero .st{font-weight:600;font-size:15px}
.mapbox{position:relative;margin:-10px 16px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.mapbox canvas{display:block;width:100%;height:220px}
.maptag{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;color:var(--muted)}
.stages{display:grid;gap:0}
.stg{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.stg:last-child{padding-bottom:0}
.stg::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.stg:last-child::before{display:none}
.stg.done::before{background:var(--leaf)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);z-index:1}
.dot svg{width:14px;height:14px;stroke-width:3}
.stg.done .dot{background:var(--leaf);border-color:var(--leaf);color:#fff}
.stg.now .dot{border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 20%,transparent)}
.stg.now .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
.stg b{display:block;font-size:14px}
.stg small{color:var(--muted);font-size:12.5px}
.rider{display:flex;gap:12px;align-items:center}
.rider .pic{width:48px;height:48px;border-radius:50%;background:var(--haldi);color:var(--haldi-ink);display:grid;place-items:center;font:800 18px var(--f-display)}
.otp{display:flex;gap:6px}
.otp span{width:34px;height:40px;border-radius:8px;background:var(--tint);display:grid;place-items:center;font:800 20px var(--f-display);color:var(--brand)}

/* orders */
.ord{display:grid;gap:10px}
.ord-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.live{background:color-mix(in srgb,var(--haldi) 25%,var(--surface));color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--leaf) 16%,var(--surface));color:var(--leaf)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs span{width:38px;height:38px;border-radius:9px;background:var(--tint);display:grid;place-items:center;font-size:20px}

/* account */
.prof{display:flex;gap:14px;align-items:center}
.prof .av{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 22px var(--f-display)}
.pass{border-radius:18px;padding:18px;background:linear-gradient(130deg,#121212,#2C2A24);color:#F7E7B4;display:grid;gap:8px;position:relative;overflow:hidden}
.pass::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:24px solid rgba(242,169,0,.18)}
.pass h3{font:800 22px var(--f-display);margin:0;letter-spacing:-.01em;color:#FFD66B}
.pass p{margin:0;font-size:13px;opacity:.85;max-width:34ch}
.pass ul{margin:4px 0 6px;padding-left:18px;font-size:13px;display:grid;gap:2px}
.pass button{justify-self:start;background:#FFD66B;color:#231800;font-weight:800;border-radius:10px;padding:10px 16px;position:relative;z-index:1}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);text-align:left;font-weight:600}
.menu button:first-child{border-top:0}
.menu button .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px;display:flex;align-items:center;gap:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.stats b{font:800 18px var(--f-display)}
.stats small{color:var(--muted);font-size:11.5px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,480px);transform:translate(-50%,105%);z-index:60;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:800 20px var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.pd-img{border-radius:18px;aspect-ratio:1.6;display:grid;place-items:center;font-size:110px;background:hsl(var(--h) 55% 93%);margin-bottom:14px;position:relative}
:root[data-theme="dark"] .pd-img{background:hsl(var(--h) 25% 18%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pd-img{background:hsl(var(--h) 25% 18%)}}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.var{border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:grid;gap:2px}
.var.on{border-color:var(--brand);background:var(--tint)}
.var b{font-size:14px}
.var small{color:var(--muted);font-size:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.facts div{background:var(--app);border-radius:10px;padding:10px;font-size:11px;color:var(--muted);display:grid;gap:2px}
.facts b{color:var(--ink);font-size:13px}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input{border:1.5px solid var(--line);background:var(--app);border-radius:10px;padding:11px 12px;outline:0}
.field input:focus{border-color:var(--brand)}
.err{color:var(--chili);font-size:12.5px;font-weight:600;min-height:1em}
.addr-opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:12px;width:100%;text-align:left;margin-bottom:10px}
.addr-opt.on{border-color:var(--brand);background:var(--tint)}
.addr-opt .t{display:grid;gap:2px;min-width:0}
.addr-opt small{color:var(--muted);font-size:12.5px}

/* toast & success */
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.success{position:fixed;inset:0;border-radius:inherit;z-index:90;background:var(--leaf);color:#fff;display:grid;place-items:center;text-align:center;padding:24px}
.success .ring{width:110px;height:110px;border-radius:50%;background:#fff;color:var(--leaf);display:grid;place-items:center;margin:0 auto 18px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.success .ring svg{width:56px;height:56px;stroke-width:3}
.success h2{font:800 28px var(--f-display);margin:0 0 6px}
@keyframes pop{from{transform:scale(.2)}}
.rotate-in{animation:slide .35s ease}
@keyframes slide{from{transform:translateY(6px);opacity:.4}}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.trend{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}

const P=RAW.map(([id,n,c,e,h,v,f={}])=>({id,n,c,e,h,v:v.map(([w,p,m])=>({w,p,m})),oos:!!f.oos,nv:!!f.nv}));

 {code:'FRESH20',t:'20% off on Fruits & Vegetables',d:'Up to ₹60 · on fresh items',min:0,calc:(b,c)=>Math.min(60,Math.round(c.fresh*.2)),need:c=>c.fresh>0},

/* ---------- state ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('turant2_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('turant2_'+k,JSON.stringify(v))}catch(e){}}};

 coupon:null,tip:0,note:[],pay:'upi',

};

/* ---------- helpers ---------- */

const rs=n=>'₹'+Math.round(n).toLocaleString('en-IN');

const off=v=>v.m>v.p?Math.round((v.m-v.p)/v.m*100):0;

 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
 bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',

/* ---------- cart math ---------- */
function lines(){return Object.entries(S.cart).filter(([,q])=>q>0).map(([k,q])=>{const[id,vi]=k.split(':');const p=PM[id];return p&&{k,p,v:p.v[+vi],q}}).filter(Boolean)}
function bill(){
 const L=lines();let item=0,mrp=0,fresh=0,count=0;
 L.forEach(l=>{item+=l.v.p*l.q;mrp+=l.v.m*l.q;count+=l.q;if(l.p.c==='fv')fresh+=l.v.p*l.q});
 const delivery=S.pass||item>=199?0:25, delMrp=25;

 const total=Math.max(0,item+delivery+handling+small-disc+(item?S.tip:0));

 return{L,item,mrp,fresh,count,delivery,handling,small,disc,total,saved,toFree:Math.max(0,199-item)};
}

 const again=[...new Set(S.orders.flatMap(o=>o.items.map(i=>i.id)))].slice(0,8).map(id=>PM[id]).filter(Boolean);
 const chai=['tea','marie','bhujia','milk','makhana','sugar'].map(id=>PM[id]);

const ROUTE=[[.12,.78],[.12,.52],[.42,.52],[.42,.3],[.72,.3],[.72,.18],[.88,.18]];

 const cs=getComputedStyle(document.documentElement),T=n=>cs.getPropertyValue(n).trim();
 x.fillStyle=T('--app');x.fillRect(0,0,W,H);
 // blocks

 for(let gx=0;gx<W;gx+=56)for(let gy=0;gy<H;gy+=48){x.beginPath();x.roundRect(gx+8,gy+8,40,32,6);x.fill()}
 x.fillStyle=T('--surface');x.globalAlpha=.6;x.beginPath();x.roundRect(W*.52,H*.58,W*.3,H*.28,14);x.fill();x.globalAlpha=1;

 const pts=ROUTE.map(([a,b])=>[a*W,b*H]);

 x.strokeStyle=T('--line');x.lineWidth=9;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();
 // progress along route during delivery stage
 const s=orderState(o);const f=s.st<2?0:Math.min(1,(s.f-.35)/.65);
 const segs=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);tot+=d}
 let rem=f*tot,rp=pts[0],done=[pts[0]];
 for(let i=0;i<segs.length;i++){if(rem<=segs[i]){const t=segs[i]?rem/segs[i]:0;rp=[pts[i][0]+(pts[i+1][0]-pts[i][0])*t,pts[i][1]+(pts[i+1][1]-pts[i][1])*t];done.push(rp);break}rem-=segs[i];done.push(pts[i+1]);rp=pts[i+1]}
 x.strokeStyle=T('--brand');x.lineWidth=5;x.setLineDash([]);x.beginPath();done.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();
 x.setLineDash([2,8]);x.strokeStyle=T('--brand');x.lineWidth=3;x.globalAlpha=.6;x.beginPath();x.moveTo(...rp);let started=false;let acc=0;for(let i=0;i<segs.length;i++){acc+=segs[i];if(acc>=f*tot){x.lineTo(...pts[i+1])}}x.stroke();x.globalAlpha=1;x.setLineDash([]);
 const pinAt=([px,py],col,label)=>{x.fillStyle=col;x.beginPath();x.arc(px,py,10,0,7);x.fill();x.fillStyle=T('--surface');x.beginPath();x.arc(px,py,4,0,7);x.fill();x.fillStyle=T('--ink');x.font='700 11px Figtree, sans-serif';x.fillText(label,px+14,py+4)};
 pinAt(pts[0],T('--haldi'),'Turant store');
 pinAt(pts[pts.length-1],T('--chili'),'');
 x.fillStyle=T('--ink');x.font='700 11px Figtree, sans-serif';x.textAlign='right';x.fillText(curAddrName(o),pts[pts.length-1][0]-14,pts[pts.length-1][1]-12);x.textAlign='left';
 if(s.st===2){x.fillStyle=T('--brand');x.beginPath();x.arc(rp[0],rp[1],13,0,7);x.fill();x.font='15px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🛵',rp[0],rp[1]+1);x.textAlign='left';x.textBaseline='alphabetic'}
}
const curAddrName=o=>o.addrLabel||'Home';

/* ---------- sheets ---------- */
let sheetProd=null,sheetVar=0;
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('show');$('#scrim').classList.add('show');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('show');$('#scrim').classList.remove('show');sheetProd=null}
function openProduct(id,vi=0){
 const p=PM[id];sheetProd=id;sheetVar=vi;const v=p.v[vi],k=id+':'+vi,o=off(v);
 if(!S.recent.includes(id)){S.recent=[id,...S.recent].slice(0,6);save()}
 const wasOpen=$('#sheet').classList.contains('show');const st=$('#sheet').scrollTop;
 openSheet(`<div class="pd-img" style="--h:${p.h}">${p.e}${o?`<span class="off" style="font-size:12px;left:12px;top:12px">${o}% OFF</span>`:''}</div>
  <div class="ptime">${ic('clock')}${p.oos?'OUT OF STOCK':'10 MINS'}</div>
  <h2>${esc(p.n)}</h2>
  <p class="sub">${CATS.find(c=>c.id===p.c).n} · ${p.nv?'Non-veg':'100% Veg'}</p>
  ${p.v.length>1?`<b style="font-size:13px">Select size</b><div class="vars">${p.v.map((x,i)=>`<button class="var ${i===vi?'on':''}" data-act="var" data-id="${id}" data-i="${i}"><b>${esc(x.w)}</b><span class="num">${rs(x.p)} ${x.m>x.p?`<small><s>${rs(x.m)}</s> · ${off(x)}% off</small>`:''}</span></button>`).join('')}</div>`:''}
  <div class="facts"><div><b>Fresh</b>Quality checked</div><div><b>48 hr</b>Easy return</div><div><b>${p.c==='fv'?'Farm':'Sealed'}</b>${p.c==='fv'?'Daily sourced':'Original pack'}</div></div>
  <div class="row" style="margin-top:16px;justify-content:space-between"><div class="price num"><b style="font-size:20px">${rs(v.p)}</b>${v.m>v.p?`<s>MRP ${rs(v.m)}</s>`:''}<div class="muted" style="font-size:11px">${esc(v.w)} · incl. of all taxes</div></div><span data-q="${k}" style="transform:scale(1.15);transform-origin:right">${stepper(k,p)}</span></div>
  <div style="margin-top:22px">${sec('Similar products',rail(P.filter(x=>x.c===p.c&&x.id!==id).slice(0,6)))}</div>`);
 if(wasOpen)$('#sheet').scrollTop=st;
}
function openAddr(form){
 const a=S.addr;
 openSheet(form?`<h2>Add a new address</h2><p class="sub">Help your rider find you easily</p>
  <form id="addrform" novalidate>
   <div class="field"><label for="f-label">Save as</label><input id="f-label" placeholder="Home, Office, Parents" maxlength="20"></div>
   <div class="field"><label for="f-line">Flat / House no., Building</label><input id="f-line" placeholder="Flat 12, Gulmohar Residency"></div>
   <div class="field"><label for="f-area">Area, Landmark</label><input id="f-area" placeholder="Near Shiv Mandir, Sector 4"></div>
   <div class="err" id="f-err"></div>
   <div class="row" style="margin-top:8px"><button type="button" class="btn ghost" data-act="addr">Back</button><button class="btn" type="submit">Save address</button></div>
  </form>`
 :`<h2>Choose a delivery address</h2><p class="sub">10-minute delivery is available in your area</p>
  ${S.addrs.map(x=>`<button class="addr-opt ${x.id===a?'on':''}" data-act="pickaddr" data-id="${x.id}">${ic('pin')}<span class="t"><b>${esc(x.label)}</b><small>${esc(x.line)}, ${esc(x.area)}</small></span></button>`).join('')}
  <button class="btn ghost" style="width:100%;margin-top:4px" data-act="newaddr">+ Add new address</button>`);
 if(form){$('#f-label').focus();$('#addrform').addEventListener('submit',e=>{e.preventDefault();const l=$('#f-label').value.trim(),li=$('#f-line').value.trim(),ar=$('#f-area').value.trim();
  if(!l||!li||!ar){$('#f-err').textContent='Please fill in all three fields so your rider can find you.';return}
  const id='a'+Date.now();S.addrs.push({id,label:l,line:li,area:ar});S.addr=id;save();closeSheet();render(true);toast('Address saved: '+l)})}
}
function openCoupons(){
 const b=bill();
 openSheet(`<h2>Coupons</h2><p class="sub">One coupon per order</p>
  <form class="coupon-in" id="cform" style="margin-bottom:14px"><input id="ccode" placeholder="Enter coupon code" aria-label="Coupon code"><button class="btn" style="flex:none;padding:10px 16px" type="submit">Apply</button></form>
  <div class="err" id="cerr" style="margin:-6px 0 10px"></div>
  ${COUPONS.map(c=>{const ok=b.item>=c.min&&(!c.need||c.need({fresh:b.fresh}));const why=!ok?(b.item<c.min?`Add ${rs(c.min-b.item)} more to unlock`:c.code==='FIRST100'?'First order only':'Add fruits or vegetables'):'';
   return `<div class="opt" style="margin-bottom:10px;cursor:default">${ic('tag')}<span class="t" style="flex:1"><b>${c.t}</b><small>${c.d}</small><small style="font-weight:700;letter-spacing:.06em;color:var(--ink);margin-top:4px">${c.code}</small>${why?`<small style="color:var(--chili)">${why}</small>`:''}</span><button class="link" ${ok?'':'disabled style="opacity:.4"'} data-act="apply" data-c="${c.code}">Apply</button></div>`}).join('')}`);
 $('#cform').addEventListener('submit',e=>{e.preventDefault();applyCoupon($('#ccode').value.trim().toUpperCase(),true)});
}
function applyCoupon(code,fromInput){
 const c=COUPONS.find(x=>x.code===code),b=bill(),err=$('#cerr');
 if(!c){if(err)err.textContent=code?`"${code}" isn't a valid coupon.`:'Enter a coupon code.';return}
 if(b.item<c.min){err.textContent=`This coupon needs a minimum order of ${rs(c.min)}.`;return}
 if(c.need&&!c.need({fresh:b.fresh})){err.textContent=c.code==='FIRST100'?'This coupon is for your first order only.':'Add fruits or vegetables to use this coupon.';return}
 S.coupon=code;closeSheet();render(true);toast(`${code} applied · ${rs(bill().disc)} saved`);
}
function openPay(){
 const b=bill();
 const opts=[['upi','UPI','Any UPI app · instant'],['card','Credit / Debit card','Visa, Mastercard, RuPay'],['wallet','Turant Wallet',`Balance ${rs(S.wallet)}${S.wallet<b.total?' · not enough':''}`],['cod','Cash / UPI on delivery','Pay the rider at your door']];
 openSheet(`<h2>Payment method</h2><p class="sub num">Pay ${rs(b.total)} · delivery in ${S.pass?8:10} min</p>
  <div style="display:grid;gap:10px">${opts.map(([k,t,d])=>`<button class="opt ${S.pay===k?'on':''}" data-act="paym" data-p="${k}"><span class="t"><b>${t}</b><small>${d}</small></span><span class="rad"></span></button>`).join('')}</div>
  <div class="err" id="perr" style="margin-top:10px"></div>
  <button class="btn" style="width:100%;margin-top:10px" data-act="place">Place order · <span class="num">${rs(b.total)}</span></button>
  <p class="muted" style="font-size:11.5px;text-align:center;margin:10px 0 0">Demo app: no real payment is made.</p>`);
}
function placeOrder(){
 const b=bill();
 if(S.pay==='wallet'&&S.wallet<b.total){$('#perr').textContent=`Your wallet has ${rs(S.wallet)}. Choose another method or add money from Account.`;return}
 if(S.pay==='wallet')S.wallet-=b.total;
 const names=['Rahul','Imran','Vikram','Sunil','Arjun','Deepak'];
 const o={id:String(Math.floor(100000+Math.random()*900000)),at:Date.now(),eta:(S.pass?8:10)*60,speed:10,
  items:b.L.map(l=>{const[id,vi]=l.k.split(':');return{id,vi:+vi,q:l.q}}),total:b.total,saved:b.saved,
  rider:names[Math.floor(Math.random()*names.length)],otp:String(Math.floor(1000+Math.random()*9000)),
  payLabel:{upi:'UPI',card:'Card',wallet:'Wallet',cod:'Pay on delivery'}[S.pay],addrLabel:curAddr().label};
 S.orders.unshift(o);S.cart={};S.coupon=null;S.tip=0;S.note=[];save();closeSheet();
 const ov=document.createElement('div');ov.className='success';ov.innerHTML=`<div><div class="ring">${ic('check')}</div><h2>Order placed!</h2><p class="num" style="margin:0;opacity:.9">#${o.id} · ${rs(o.total)}<br>${o.rider} will deliver it in ${S.pass?8:10} minutes</p></div>`;
 $('#vp').appendChild(ov);
 setTimeout(()=>{ov.remove();S.trackId=o.id;S.view='track';render()},1700);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset;
 switch(d.act){
  case 'nav': if(d.v==='cats'&&!S.cat)S.cat='fv'; closeSheet(); S.view=d.v||'cats'; render(); break;
  case 'cat': closeSheet(); S.cat=d.c; S.sort='rel'; S.view='cats'; render(); break;
  case 'add': changeQty(d.k,1); break;
  case 'dec': changeQty(d.k,-1); break;
  case 'open': openProduct(d.id); break;
  case 'var': openProduct(d.id,+d.i); break;
  case 'notify': toast("We'll notify you when it's back in stock"); break;
  case 'close': closeSheet(); break;
  case 'reset': try{Object.keys(localStorage).filter(k=>k.startsWith('turant2_')).forEach(k=>localStorage.removeItem(k))}catch(err){} location.reload(); break;
  case 'sort': S.sort=d.s; render(true); break;
  case 'veg': S.vegOnly=!S.vegOnly; render(true); break;
  case 'q': S.q=d.q; render(); break;
  case 'clearrecent': S.recent=[]; save(); $('#sres').innerHTML=searchResults(); break;
  case 'addr': openAddr(false); break;
  case 'newaddr': openAddr(true); break;
  case 'pickaddr': S.addr=d.id; save(); closeSheet(); render(true); toast('Delivering to '+curAddr().label); break;
  case 'coupons': openCoupons(); break;
  case 'apply': applyCoupon(d.c); break;
  case 'rmcoupon': S.coupon=null; render(true); break;
  case 'tip': S.tip=+d.t; render(true); if(S.tip)toast(`Thank you! Your ₹${S.tip} tip goes to the rider`); break;
  case 'note': S.note=S.note.includes(d.n)?S.note.filter(x=>x!==d.n):[...S.note,d.n]; render(true); break;
  case 'pay': openPay(); break;
  case 'paym': S.pay=d.p; openPay(); break;
  case 'place': placeOrder(); break;
  case 'track': S.trackId=d.id; S.view='track'; render(); break;
  case 'reorder': { const o=S.orders.find(x=>x.id===d.id); let n=0; o.items.forEach(i=>{const p=PM[i.id];if(p.oos)return;const k=i.id+':'+i.vi;S.cart[k]=Math.min(10,qty(k)+i.q);n++}); save(); S.view='cart'; render(); toast(n+' items added to your cart'); break; }
  case 'pass': S.pass=!S.pass; save(); render(true); toast(S.pass?'Turant Pass is active. Enjoy free delivery':'Turant Pass cancelled'); break;
  case 'addmoney': S.wallet+=200; save(); render(true); toast('₹200 added to your wallet (demo)'); break;
  case 'theme': { const r=document.documentElement; const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches); r.dataset.theme=dark?'light':'dark'; render(true); if(S.view==='track')drawMap(); break; }
  case 'refer': openSheet(`<h2>Refer &amp; earn ₹100</h2><p class="sub">Share your code. When your friend places their first order, you both get ₹100 wallet cash.</p><div class="coupon-in"><input id="refcode" value="GANESH100" readonly aria-label="Referral code"><button class="btn" style="flex:none;padding:10px 16px" data-act="copyref">Copy</button></div>`); break;
  case 'copyref': { const v='GANESH100'; navigator.clipboard?.writeText(v).then(()=>toast('Code copied')).catch(()=>{const i=$('#refcode');i.select();toast('Code selected, copy it now')}); if(!navigator.clipboard){$('#refcode').select()} break; }
  case 'help': openSheet(`<h2>Help &amp; support</h2><p class="sub">Frequently asked questions</p>
    ${[['Order running late?','If your order is more than 10 minutes late, you get ₹25 wallet cash.'],['Item damaged or missing?','Send a photo from order details within 48 hours for an instant refund or replacement.'],['How do I cancel an order?','Cancel before packing starts for a full refund.'],['What are the delivery hours?','Every day, 6 AM to 2 AM.']].map(([q,a])=>`<details class="card" style="margin-bottom:10px"><summary style="font-weight:700;cursor:pointer">${q}</summary><p class="muted" style="margin:8px 0 0;font-size:13.5px">${a}</p></details>`).join('')}`); break;
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pc[role=button]')){e.preventDefault();openProduct(e.target.dataset.id)}
});
addEventListener('resize',()=>{if(S.view==='track')drawMap()});
const IS_MOBILE=/Android|iPhone|iPod|Mobile|Opera Mini|IEMobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform))||(matchMedia('(pointer:coarse)').matches&&matchMedia('(max-width:1024px)').matches);
if(IS_MOBILE)render();else{$('#gate').hidden=false;$('#stage').hidden=true}
</script>
