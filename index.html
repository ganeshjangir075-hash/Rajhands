<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B0145A">
<title>Dress Rental Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; sheets slide up for forms and detail */
:root{
  --bg:#FAF6F8; --surface:#FFFFFF; --surface-2:#F4ECF1; --line:#E8DAE2; --line-2:#D9C6D1;
  --fg:#25141E; --muted:#7A6170; --faint:#A890A0;
  --accent:#B0145A; --accent-ink:#FFFFFF; --accent-soft:#FBE2EE;
  --gold:#946410; --gold-soft:#F7EBD0;
  --ok:#1D7748; --ok-soft:#DCF1E5; --warn:#9E5800; --warn-soft:#FCEAD0;
  --bad:#B1251C; --bad-soft:#FADFDC; --info:#2C5A99; --info-soft:#DFE9F7;
  --shadow:0 1px 2px rgba(60,20,40,.06),0 8px 24px rgba(60,20,40,.08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Figtree",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140D12; --surface:#1E151B; --surface-2:#281D25; --line:#382A33; --line-2:#4A3843;
  --fg:#F4EAF0; --muted:#B7A0AE; --faint:#85707D;
  --accent:#F2629F; --accent-ink:#22091A; --accent-soft:#3E1A2C;
  --gold:#E4B75C; --gold-soft:#3A2C12;
  --ok:#62CB91; --ok-soft:#163324; --warn:#F2AA4E; --warn-soft:#3A2911;
  --bad:#FF8C82; --bad-soft:#3F1B18; --info:#90B6F0; --info-soft:#17253A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140D12; --surface:#1E151B; --surface-2:#281D25; --line:#382A33; --line-2:#4A3843;
  --fg:#F4EAF0; --muted:#B7A0AE; --faint:#85707D;
  --accent:#F2629F; --accent-ink:#22091A; --accent-soft:#3E1A2C;
  --gold:#E4B75C; --gold-soft:#3A2C12;
  --ok:#62CB91; --ok-soft:#163324; --warn:#F2AA4E; --warn-soft:#3A2911;
  --bad:#FF8C82; --bad-soft:#3F1B18; --info:#90B6F0; --info-soft:#17253A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{zoom:var(--z,1)}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.84em;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(var(--vh,1vh) * 100);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 20px var(--f-display);flex:none;
  background-image:repeating-conic-gradient(from 0deg,transparent 0 12deg,rgba(255,255,255,.14) 12deg 24deg)}
.brand-name{font:800 18px/1.1 var(--f-display);letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-btn .badge{margin-left:auto}
@media (max-height:820px){.side{padding:14px 12px;gap:2px}.brand{padding-bottom:10px}.nav-btn{padding:7px 12px}}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 12px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

.main{min-width:0;padding-inline:28px;padding-block:22px 110px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar h1{font:800 32px/1.08 var(--f-display);letter-spacing:-.03em;margin:0;text-wrap:balance}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

.tabbar{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:999px;padding:13px 20px;box-shadow:var(--shadow)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;line-height:1.6}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-gold{background:var(--gold-soft);color:var(--gold)}
.p-mute{background:var(--surface-2);color:var(--muted)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{margin:0;font:800 17px/1.2 var(--f-display);letter-spacing:-.015em}
.panel-b{padding:14px 16px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;cursor:default}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--line-2)}
.kpi .v{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;font-size:clamp(20px,1.75vw,26px);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)} .kpi.alert .v{color:var(--bad)}
.kpi.warnk{border-color:var(--warn);background:var(--warn-soft)} .kpi.warnk .v{color:var(--warn)}
.kpi.money .v{color:var(--gold)}

/* reminders */
.rem-group{padding:4px 0}
.rem-group+.rem-group{border-top:1px dashed var(--line)}
.rem-title{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.rem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.rem:hover{background:var(--surface-2)}
.rem-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.rem-ic svg{width:18px;height:18px}
.rem-main{min-width:0}
.rem-main b{font-weight:700}
.rem-main .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem-when{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.ic-prep{background:var(--warn-soft);color:var(--warn)} .ic-del{background:var(--info-soft);color:var(--info)}
.ic-ret{background:var(--ok-soft);color:var(--ok)} .ic-late{background:var(--bad-soft);color:var(--bad)}
.ic-dep{background:var(--gold-soft);color:var(--gold)} .ic-clean{background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

.stock-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:10px 0 12px}
.stock-bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

.saave{display:flex;flex-wrap:wrap;gap:6px}
.saave span{border:1px solid var(--line-2);border-radius:8px;padding:4px 8px;font-size:12.5px;text-align:center;line-height:1.2}
.saave span b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.saave span i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);max-width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.saave span.soon i{color:inherit;opacity:.8}
.saave span.soon{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* toolbar & tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;min-width:180px;max-width:340px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--line-2)}

/* dress cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.dcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.dphoto{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);position:relative;display:grid;place-items:center;overflow:hidden}
.dphoto img{width:100%;height:100%;object-fit:cover}
.dphoto .ph{font:800 44px var(--f-display);color:var(--accent);opacity:.55}
.dphoto .pill{position:absolute;top:8px;left:8px}
.dphoto .code{position:absolute;bottom:8px;right:8px;background:var(--surface);border-radius:6px;padding:1px 7px}
.ph-pattern{position:absolute;inset:0;background-image:radial-gradient(var(--line-2) 1.2px,transparent 1.3px);background-size:14px 14px;opacity:.7}
.dbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.dname{font-weight:700;line-height:1.25}
.dmeta{font-size:12.5px;color:var(--muted)}
.drow{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.meter{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--gold);border-radius:999px}
.meter.done span{background:var(--ok)}

/* sheets / modals */
.scrim{position:fixed;inset:0;background:rgba(20,8,16,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end;padding:0}
@media (min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:min(calc(var(--vh,1vh) * 92),100%);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease}
.sheet.wide{max-width:860px}
@media (min-width:760px){.sheet{border-radius:16px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface);border-radius:16px 16px 0 0}
.sheet-h h2{margin:0;font:800 20px/1.2 var(--f-display);letter-spacing:-.01em;flex:1;min-width:0}
.sheet-b{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.sheet-b>*{flex-shrink:0}
.sheet-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:760px){.sheet-f{border-radius:0 0 16px 16px}}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--faint)}
.fsec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:14px;align-content:start}
.calc .ln{display:flex;justify-content:space-between;gap:10px}
.calc .ln.tot{border-top:1px solid var(--line);padding-top:7px;font-weight:700}
.calc>.ln.tot:first-child,.calc>.label+.ln.tot{border-top:0;padding-top:0}
.calc .ln.big{font-size:17px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500}
.badbox{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:8px;align-items:start}
.item-row .clash{grid-column:1/-1;margin-top:-2px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .prev{width:84px;height:84px;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.photo-pick .prev img{width:100%;height:100%;object-fit:cover}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent)}

/* detail */
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.dl div{min-width:0}
.dl dt{font-size:12px;color:var(--muted);margin:0}
.dl dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.steps{display:flex;gap:0;margin:2px 0}
.step{flex:1;text-align:center;font-size:12px;color:var(--faint);position:relative;padding-top:20px}
.step:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line-2);transform:translateX(-50%);z-index:1}
.step:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.step:first-child:after{display:none}
.step.done{color:var(--fg);font-weight:600}
.step.done:before,.step.done:after{background:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist-i{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.hist-i:last-child{border-bottom:0}
.hist-d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero-fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hero-fin>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.hero-fin .v{font-family:var(--f-display);font-weight:800;letter-spacing:-.02em;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dh{padding:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .dc{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;background:none;border-top:0;border-left:0;text-align:left;font:inherit}
.cal .dc:hover{background:var(--surface-2)}
.cal .dc.other{opacity:.38}
.cal .dc.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.cal .dc.saava{background:linear-gradient(var(--gold-soft),transparent 60%)}
.dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ev{font-size:11.5px;padding:1px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.d{background:var(--info-soft);color:var(--info)} .ev.r{background:var(--ok-soft);color:var(--ok)} .ev.e{background:var(--accent-soft);color:var(--accent)}
.saava-tag{font-size:10.5px;color:var(--gold);font-weight:700;letter-spacing:.04em}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px;font-weight:500}
.banner .btn{margin-left:auto}

/* responsive */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.dash-grid{grid-template-columns:minmax(0,1fr)}.hero-fin{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-inline:16px;padding-block:16px 150px}
  .topbar h1{font-size:25px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;cursor:pointer;position:relative;min-width:0}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent);font-weight:600}
  .tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);transform:scale(.85)}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px;padding:12px 16px}
  .cols-2{grid-template-columns:minmax(0,1fr)}
  .cal .dc{min-height:62px;padding:3px}
  .cal .ev{font-size:10px;padding:0 3px}
  .cal .dh{padding:6px 3px;font-size:10px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid,.fgrid.c3{grid-template-columns:minmax(0,1fr)}
  .dl{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .item-row{grid-template-columns:minmax(0,1fr) 88px 36px}
  .hist-i{grid-template-columns:70px minmax(0,1fr) auto}
  .cal .ev{display:none}
  .cal .dc .cnt{display:flex}
}

    pr.catch(e=>toast(e&&e.code==="permission-denied"?"This account is not allowed to change the ledger.":"Could not save to the cloud ("+((e&&e.code)||"error")+"). Please try again.","bad"));

/* ---------- accounting ---------- */
function landed(d){return N(d.cost)+N(d.extra)}
function depPer(d){if(!d)return 0;return Math.max(0,(landed(d)-N(d.resale))/Math.max(1,N(d.life)||1))}
const counts=b=>["delivered","returned","closed"].includes(b.status);
/* dry-clean / repair: estimate until the return, then the amount entered at return (old estimate shown struck through if changed) */
function costTag(b,k){const d=(b.status==="returned"||b.status==="closed")&&b.ret;const bill=d&&Object.values((b.ret||{}).act||{}).some(x=>x&&x[k]!=null);if(d&&!bill&&b.ret[k]!=null&&!N(b.ret[k]))return "";return '<span class="small" style="opacity:.75"> · '+(bill?(k==="repair"?"tailor's bill":"cleaner's bill"):d?"estimate, bill pending":"estimate")+'</span>'}
function costNum(b,actual,k,per){const ri=b.ret||{},d=(b.status==="returned"||b.status==="closed")&&b.ret;
  if(d){const est=ri[k]!=null?N(ri[k]):(b.items||[]).length*N(per);if(Math.round(est)!==Math.round(actual))return '<span class="num"><s class="muted" title="Estimate before the return">'+inr(-est)+'</s> '+inr(-actual)+'</span>'}
  return '<span class="num">'+inr(-actual)+'</span>'}
function fin(b){
  const st=ST(), items=b.items||[], n=items.length||0, ri=b.ret||{};
  const rent=items.reduce((a,i)=>a+N(i.rent),0);
  const gross=Math.max(0,rent-N(b.discount));
  const extras=N(ri.lateFee)+N(ri.damage);
  const revenue=gross+extras;
  const done=b.status==="returned"||b.status==="closed";
  const act=ri.act||{},nn=Math.max(1,n);
  const cPer=done&&ri.clean!=null?N(ri.clean)/nn:N(st.clean),rPer=done&&ri.repair!=null?N(ri.repair)/nn:N(st.repair);
  const clean=done?items.reduce((a,i)=>a+(act[i.dressId]&&act[i.dressId].clean!=null?N(act[i.dressId].clean):cPer),0):n*st.clean;
  const repair=done?items.reduce((a,i)=>a+(act[i.dressId]&&act[i.dressId].repair!=null?N(act[i.dressId].repair):rPer),0):n*st.repair;
  const pack=n*st.pack, comm=N(b.commission), fitc=N((b.fit||{}).cost);
  const direct=clean+repair+fitc+pack+comm;
  const dep=items.reduce((a,i)=>a+depPer(D()[i.dressId]),0);
  const contrib=revenue-direct-dep;
  const depositKept=0;
  const due=revenue-N(b.paid)-depositKept;
  return {rent,gross,extras,revenue,clean,repair,fit:fitc,pack,comm,direct,dep,contrib,due,depositKept,n};
}
function dressLife(id){
  const d=D()[id]; const out={bookings:[],count:0,revenue:0,direct:0,upcoming:[]};
  if(!d)return out;
  list(B()).forEach(b=>{
    const it=(b.items||[]).find(i=>i.dressId===id); if(!it||b.status==="cancelled")return;
    if(counts(b)){
      const f=fin(b); const share=f.rent>0?N(it.rent)/f.rent:1/(f.n||1);
      out.revenue+=f.revenue*share; out.direct+=f.direct*share; out.count++; out.bookings.push(b);
    }else if(b.status!=="draft")out.upcoming.push(b);
  });
  out.bookings.sort((a,b)=>a.deliveryDate<b.deliveryDate?1:-1);
  out.upcoming.sort((a,b)=>a.deliveryDate<b.deliveryDate?-1:1);
  out.net=out.revenue-out.direct;
  out.cost=landed(d);
  out.recovered=out.cost>0?Math.min(1,Math.max(0,out.net/out.cost)):1;
  out.profit=out.net-out.cost+(d.status==="sold"?N(d.soldFor):0);
  out.dep=depPer(d)*out.count;
  out.left=Math.max(0,N(d.life)-out.count);
  return out;
}
function dressState(id){
  const d=D()[id]; if(!d)return "available";
  if(d.status==="sold"||d.status==="retired")return d.status;
  const bs=list(B()).filter(b=>(b.items||[]).some(i=>i.dressId===id));
  if(bs.some(b=>b.status==="delivered"))return "out";
  if(d.status==="cleaning"||d.status==="repair")return d.status;
  if(bs.some(b=>(b.status==="booked"||b.status==="ready"||(b.status==="draft"&&N(b.paid)>0))&&b.returnDate>=today()))return "booked";
  return "available";
}

}
function clashes(dressId,from,to,exceptId){
  if(!dressId||!from||!to)return [];
  const buf=ST().buffer;
  return list(B()).filter(b=>b.id!==exceptId&&(["booked","ready","delivered"].includes(b.status)||(b.status==="draft"&&N(b.paid)>0))&&(b.items||[]).some(i=>i.dressId===dressId)&&from<=addDays(b.status==="delivered"&&b.returnDate<today()?today():b.returnDate,buf)&&b.deliveryDate<=addDays(to,buf));
}
function monthStats(ym){
  const bs=list(B()).filter(b=>counts(b)&&(b.deliveryDate||"").slice(0,7)===ym);
  const t={count:bs.length,revenue:0,direct:0,dep:0,contrib:0,items:0,bookings:bs};
  bs.forEach(b=>{const f=fin(b);t.revenue+=f.revenue;t.direct+=f.direct;t.dep+=f.dep;t.contrib+=f.contrib;t.items+=f.n});
  t.cancelKept=list(B()).filter(b=>b.status==="cancelled"&&(b.cancelledOn||(b.updatedAt?ymd(new Date(b.updatedAt)):"")).slice(0,7)===ym).reduce((a,b)=>a+Math.max(0,N(b.cancelKept!=null?b.cancelKept:b.paid)),0);
  t.revenue+=t.cancelKept;t.contrib+=t.cancelKept;
  const ex=list(E()).filter(e=>(e.date||"").slice(0,7)===ym);
  t.expenses=ex.reduce((a,e)=>a+N(e.amount),0);
  t.estimated=false;t.noExp=ex.length===0;
  t.fixed=t.expenses;
  t.net=t.contrib-t.fixed;
  return t;
}

function tasks(){
  const t=today(), st=ST(), out=[];
  list(B()).forEach(b=>{
    if(b.status==="booked"){
      const p=addDays(b.deliveryDate,-st.prepDays);
      out.push({type:"prep",date:p<t&&b.deliveryDate>=t?t:p,late:p<t,b});
    }
    if(b.status==="booked"||b.status==="ready"){
      out.push({type:b.deliveryDate<t?"late-del":"del",date:b.deliveryDate,b});
    }
    if(b.status==="delivered"){
      out.push({type:b.returnDate<t?"late":"ret",date:b.returnDate,b});
    }
    if(b.status==="returned"){out.push({type:"dep",date:(b.ret||{}).on||b.returnDate,b})}
  });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}

/* ---------- Cleaning & Repair ---------- */
const CL=()=>S.data.cleanings||{};
const CLW={clean:{name:"Dry-cleaning",who:"cleaner",Who:"Cleaner",at:"At cleaner",ic:"drop",slip:"DRY-CLEANING SLIP",pre:"CL-",ph:"e.g. Shyam Dry Cleaners"},repair:{name:"Repair",who:"tailor",Who:"Tailor",at:"At tailor",ic:"scissors",slip:"REPAIR SLIP",pre:"RP-",ph:"e.g. Raju Tailor"}};
const NEEDT={clean:"Dry-cleaning",both:"Repair, then dry-cleaning",repair:"Repair only"};
function clKind(bt){return bt.kind||((bt.items||[]).length&&bt.items.every(i=>i.kind==="repair")?"repair":"clean")}
function clOpen(did){for(const bt of list(CL())){if(bt.cancelled)continue;const it=(bt.items||[]).find(i=>i.dressId===did&&!i.back);if(it)return {bt,it}}return null}
function clStage(did){const s=dressState(did);if(s!=="cleaning"&&s!=="repair")return "";return clOpen(did)?"out":"give"}
function clNeed(d){const w=d.work||{};if(d.status==="repair")return w.need==="both"||w.need==="repair"?w.need:"repair";return "clean"}
function clLastBooking(did){return list(B()).filter(b=>(b.status==="returned"||b.status==="closed")&&(b.items||[]).some(i=>i.dressId===did)).sort((a,b)=>((b.ret||{}).on||b.returnDate)<((a.ret||{}).on||a.returnDate)?-1:1)[0]}
function clNextBooking(did){const t=today();return list(B()).filter(b=>(b.status==="booked"||b.status==="ready")&&b.deliveryDate>=t&&(b.items||[]).some(i=>i.dressId===did)).sort((a,b)=>a.deliveryDate<b.deliveryDate?-1:1)[0]}
function clSince(d){if(d.work&&d.work.since)return d.work.since;const lb=clLastBooking(d.id),r=lb?((lb.ret||{}).on||lb.returnDate):"";const lastBack=list(CL()).flatMap(bt=>(bt.items||[]).filter(i=>i.dressId===d.id&&i.back).map(i=>i.back)).sort().pop()||"";return r>lastBack?r:(d.cleanSince&&d.cleanSince>lastBack?d.cleanSince:(r||d.cleanSince||""))}
function clCleaners(k){const set=new Set();list(CL()).filter(bt=>clKind(bt)===(k||"clean")).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).forEach(bt=>bt.cleaner&&set.add(bt.cleaner));return [...set]}
function clCost(bt){return (bt.charges||[]).reduce((a,c)=>a+N(c.amount),0)}
function clUnpaid(bt){return (bt.charges||[]).filter(c=>!c.paid).reduce((a,c)=>a+N(c.amount),0)}
function clGive(k){return list(D()).filter(d=>clStage(d.id)==="give"&&(!k||(k==="repair")===(d.status==="repair"))).map(d=>({d,nb:clNextBooking(d.id),lb:clLastBooking(d.id),since:clSince(d)})).sort((a,b)=>{const x=a.nb?a.nb.deliveryDate:"9999",y=b.nb?b.nb.deliveryDate:"9999";return x<y?-1:x>y?1:(a.since<b.since?-1:1)})}
function clOutBatches(k){return list(CL()).filter(bt=>!bt.cancelled&&(!k||clKind(bt)===k)&&(bt.items||[]).some(i=>!i.back)).sort((a,b)=>a.sentOn<b.sentOn?-1:1)}
function clOutCount(k){return clOutBatches(k).reduce((a,bt)=>a+bt.items.filter(i=>!i.back).length,0)}
function clCount(){const n=document.querySelectorAll(".cl-chk:checked").length,el=document.getElementById("cl_cnt");if(el)el.textContent=n?n+" selected":"Tick the dresses you are giving now"}
function clUrgent(nb){if(!nb)return false;return diff(today(),nb.deliveryDate)<=N(ST().prepDays)+1}
/* fitting by the tailor (before pick-up) */
const fitWin=()=>N(ST().prepDays)||2;
function bkMeas(b){return b.meas||((C()[b.customerId]||{}).meas)||null}
function fitDressOk(d){return d&&!/jewel/i.test(d.category||"")}
function fitNow(b,did){const nb=clNextBooking(did);return nb&&nb.id===b.id&&["available","booked"].includes(dressState(did))}
function fitOpen(bid,did){for(const bt of list(CL())){if(bt.cancelled)continue;const it=(bt.items||[]).find(i=>((i.kind==="fit"&&i.bookingId===bid)||i.fitFor===bid)&&(!did||i.dressId===did)&&!i.back);if(it)return {bt,it}}return null}
function fitPending(b,t){return b.status==="booked"&&b.deliveryDate>=t&&!(b.fit&&b.fit.done)}
function fitGive(){const t=today(),out=[];list(B()).filter(b=>{const f=b.fit||{};return fitPending(b,t)&&(f.want||(!f.noTailor&&hasMeas(bkMeas(b))&&diff(t,b.deliveryDate)<=fitWin()))}).sort((a,b)=>a.deliveryDate<b.deliveryDate?-1:1).forEach(b=>(b.items||[]).forEach(i=>{const d=D()[i.dressId];if(!fitDressOk(d)||fitOpen(b.id,i.dressId)||!fitNow(b,i.dressId))return;out.push({b,d:Object.assign({id:i.dressId},d)})}));return out}
function fitCand(){const t=today(),shown=new Set(fitGive().map(x=>x.b.id));return list(B()).filter(b=>fitPending(b,t)&&!shown.has(b.id)&&(b.items||[]).some(i=>fitDressOk(D()[i.dressId])&&!fitOpen(b.id,i.dressId)&&fitNow(b,i.dressId))).sort((a,b)=>a.deliveryDate<b.deliveryDate?-1:1)}
async function setDressFit(did,bkId,on){const d=D()[did],b=B()[bkId];if(!d||!b)return;const m=measTxt(bkMeas(b)||{});if(!m)return;const q=clone(d);delete q.id;q.fitNow={size:m,bookingId:bkId,on:on||today()};try{LOGCTX.skip=true;await put("dresses",did,q)}finally{LOGCTX.skip=false}}
function fitNowTxt(d){const f=d&&d.fitNow;if(!f)return "";const b=B()[f.bookingId];return f.size+(b?" (for "+BN(b.no)+" · "+custName(b.customerId)+", "+fd(f.on)+")":"")}
function fitFor(i){const b=B()[i.fitFor||i.bookingId];return b?'For '+esc(BN(b.no))+' · '+esc(custName(b.customerId))+' · pick-up '+fd(b.deliveryDate):""}
/* rush: next pick-up today/tomorrow — tailor in hours, then cleaner the same day */
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function t12(x){if(!x)return "";const [h,m]=x.split(":").map(Number);return ((h%12)||12)+(m?":"+String(m).padStart(2,"0"):"")+" "+(h<12?"am":"pm")}
function inHours(n){const d=new Date(Date.now()+n*36e5);d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);return d.toDateString()!==new Date().toDateString()?"23:45":hm(d)}
function clTimeUp(bt){const t=today();return !!bt.expBack&&(bt.expBack<t||(bt.expBack===t&&!!bt.expTime&&hm(new Date())>=bt.expTime))}
function itemNB(i){return i.fitFor&&B()[i.fitFor]?B()[i.fitFor]:clNextBooking(i.dressId)}
function rushList(){const t=today(),out=[],dd=nb=>nb?diff(t,nb.deliveryDate):99,soon=nb=>nb&&dd(nb)<=1;

/* ---------- Calendar ---------- */
function viewCalendar(){
  const t=today(); if(!V.calM)V.calM=t.slice(0,7);
  const [y,m]=V.calM.split("-").map(Number);
  const first=new Date(y,m-1,1), start=new Date(first); start.setDate(1-first.getDay());
  const bs=list(B()).filter(b=>b.status!=="cancelled"&&b.status!=="draft");
  let cells="";
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d);
    const ev=[];
    bs.forEach(b=>{
      if(b.deliveryDate===s&&b.status!=="closed")ev.push(["d","↑ "+custName(b.customerId)]);
      if(b.eventDate===s)ev.push(["e","★ "+(b.func||"Function")]);
      if(b.returnDate===s&&(b.status==="delivered"||b.status==="booked"||b.status==="ready"))ev.push(["r","↓ "+custName(b.customerId)]);
    });
    const sv=saave().includes(s);
    cells+='<button type="button" class="dc'+(d.getMonth()!==m-1?" other":"")+(s===t?" today":"")+(sv?" saava":"")+'" data-day="'+s+'"><span style="display:flex;justify-content:space-between;align-items:center"><span class="dn">'+d.getDate()+'</span>'+(sv?'<span class="saava-tag">MUHURAT</span>':"")+'</span>'+
      ev.slice(0,3).map(e=>'<span class="ev '+e[0]+'">'+esc(e[1])+'</span>').join("")+(ev.length>3?'<span class="small muted">+'+(ev.length-3)+' more</span>':"")+
      '<span class="cnt">'+ev.map(e=>'<i style="background:var(--'+(e[0]==="d"?"info":e[0]==="r"?"ok":"accent")+')"></i>').join("")+'</span></button>';
  }
  return top(MONF[m-1]+" "+y,'<span class="pill p-info">↑ Handover</span> <span class="pill p-acc">★ Function</span> <span class="pill p-ok">↓ Return</span> <span class="pill p-gold">Wedding date</span>',
   '<button type="button" class="btn" data-cal="-1" aria-label="Previous month">'+ic("left")+'</button><button type="button" class="btn" data-cal="0">Today</button><button type="button" class="btn" data-cal="1" aria-label="Next month">'+ic("right")+'</button>')+
  '<div class="tbl-wrap"><div class="cal">'+WD.map(w=>'<div class="dh">'+w+'</div>').join("")+cells+'</div></div>';
}
function openDay(s){
  const bs=list(B()).filter(b=>b.status!=="cancelled"&&b.status!=="draft"&&(b.deliveryDate===s||b.returnDate===s||b.eventDate===s));
  const free=list(D()).filter(d=>d.status!=="sold"&&d.status!=="retired"&&clashes(d.id,s,s).length===0);
  modal({title:fdw(s)+" "+parseD(s).getFullYear(),body:()=>
    (saave().includes(s)?'<div class="okbox"><b>'+esc(saaveNote(s))+'</b> · an auspicious wedding date; expect more bookings.</div>':"")+
    '<div class="panel">'+(bs.length?bs.map(b=>{const tags=[];if(b.deliveryDate===s)tags.push('<span class="pill p-info">Handover</span>');if(b.eventDate===s)tags.push('<span class="pill p-acc">'+esc(b.func||"Function")+'</span>');if(b.returnDate===s)tags.push('<span class="pill p-ok">Return</span>');
      return '<button type="button" class="rem" data-open-b="'+b.id+'"><span class="rem-ic ic-del">'+ic("book")+'</span><span class="rem-main"><b>'+esc(custName(b.customerId))+'</b> <span class="mono muted">'+esc(BN(b.no))+'</span><div class="l2">'+esc(bookingDresses(b))+'</div></span><span class="rem-when">'+tags.join(" ")+'</span></button>'}).join(""):'<div class="empty">No bookings on this day</div>')+'</div>'+
    '<div><div class="label" style="margin-bottom:8px">Dresses free on this day ('+free.length+')</div><div class="small">'+(free.length?free.map(d=>'<span class="pill p-ok" style="margin:0 4px 4px 0">'+esc(d.code)+' '+esc(d.name)+'</span>').join(""):'<span class="muted">No dresses free</span>')+'</div></div>',
   foot:'<button type="button" class="btn" data-bl-day="'+s+'">'+ic("print")+'Print / download this day</button><button type="button" class="btn pri" data-new-b-date="'+s+'">'+ic("plus")+'Book for this day</button>',live:true});
}

/* ---------- Accounts ---------- */
function viewAccounts(){
  const t=today(); if(!V.accM)V.accM=t.slice(0,7);
  const ym=V.accM, ms=monthStats(ym);
  const [y,m]=ym.split("-").map(Number);
  // 6 month chart
  const months=[];for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);months.push(ymd(d).slice(0,7))}
  const series=months.map(k=>({k,s:monthStats(k)}));
  const maxV=Math.max(1000,...series.map(x=>Math.max(x.s.revenue,Math.abs(x.s.net))));
  const W=560,H=200,pl=48,pb=26,pt=12,cw=(W-pl-8)/6;
  const yS=v=>pt+(H-pt-pb)*(1-(v/maxV));
  const minNet=Math.min(0,...series.map(x=>x.s.net));
  const yMin=minNet<0?minNet:0;
  const yS2=v=>pt+(H-pt-pb)*((maxV-v)/(maxV-yMin));
  const ticks=[0,maxV/2,maxV];if(yMin<0)ticks.push(yMin);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenue and profit for the last 6 months">';
  ticks.forEach(v=>{svg+='<line x1="'+pl+'" x2="'+(W-8)+'" y1="'+yS2(v)+'" y2="'+yS2(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(yS2(v)+4)+'" text-anchor="end">'+(Math.abs(v)>=1000?(v<0?"-":"")+"₹"+Math.round(Math.abs(v)/1000)+"k":"₹"+Math.round(v))+'</text>'});
  series.forEach((x,i)=>{
    const cx=pl+cw*i+cw/2, bw=Math.min(22,cw/3.2);
    const r0=yS2(0), rv=yS2(x.s.revenue), nv=yS2(x.s.net);
    svg+='<rect x="'+(cx-bw-2)+'" y="'+Math.min(rv,r0)+'" width="'+bw+'" height="'+Math.max(1,Math.abs(r0-rv))+'" rx="3" fill="var(--gold)" opacity="'+(x.k===ym?1:.55)+'"><title>Revenue '+inr(x.s.revenue)+'</title></rect>';
    svg+='<rect x="'+(cx+2)+'" y="'+Math.min(nv,r0)+'" width="'+bw+'" height="'+Math.max(1,Math.abs(r0-nv))+'" rx="3" fill="'+(x.s.net>=0?"var(--ok)":"var(--bad)")+'" opacity="'+(x.k===ym?1:.55)+'"><title>Profit '+inr(x.s.net)+'</title></rect>';
    svg+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle"'+(x.k===ym?' style="fill:var(--fg);font-weight:700"':"")+'>'+MON[+x.k.slice(5)-1]+'</text>';
  });
  svg+='</svg>';
  const dressRows=list(D()).map(d=>Object.assign({d},dressLife(d.id))).sort((a,b)=>b.profit-a.profit);
  const ex=list(E()).filter(e=>(e.date||"").slice(0,7)===ym).sort((a,b)=>a.date<b.date?1:-1);
  const advHeld=list(B()).filter(b=>b.status==="booked"||b.status==="ready"||b.status==="draft").reduce((a,b)=>a+N(b.paid),0);
  const recv=list(B()).filter(counts).reduce((a,b)=>{const f=fin(b);return a+(f.due>0?f.due:0)},0);
  const bk=ms.bookings.slice().sort((a,b)=>a.deliveryDate<b.deliveryDate?-1:1);
  const inM=x=>(x.date||"").slice(0,7)===ym&&x.mode!=="Transfer";
  const allIn=list(B()).flatMap(b=>payList(b).filter(inM)).concat(list(C()).flatMap(c=>(c.adv||[]).filter(inM)));
  const recvCash=allIn.filter(x=>x.mode==="Cash").reduce((q,x)=>q+N(x.amount),0);
  const recv0=allIn.reduce((q,x)=>q+N(x.amount),0);
  return top("Accounts",'Real profit after each booking\'s direct costs, dress depreciation and shop expenses',
   '<button type="button" class="btn" data-acc="-1" aria-label="Previous month">'+ic("left")+'</button><button type="button" class="btn" style="min-width:130px;justify-content:center" data-acc="0">'+MONF[m-1]+' '+y+'</button><button type="button" class="btn" data-acc="1" aria-label="Next month">'+ic("right")+'</button><button type="button" class="btn pri" data-act="month-report">'+ic("down")+'Month report (PDF)</button>')+
  '<div class="kpis">'+
   kpi("Revenue",inr(ms.revenue),ms.count+" handed over · "+ms.items+" items","money")+
   kpi("Direct costs",inr(ms.direct),"dry-clean, repair, commission")+
   (()=>{const dt=dueTotal(),dn=dueBookings().length;return '<div class="kpi click'+(dt>0?" warnk":"")+'" data-act="duelist" role="button" tabindex="0"><div class="label">Payment to receive</div><div class="v">'+inr(dt)+'</div><div class="h">'+(dn?dn+" bookings · tap to see who":"all collected")+'</div></div>'})()+
   kpi("Shop expenses",inr(ms.fixed),ms.noExp?"none recorded · add in Expenses":ex.length+" entries","click","expenses")+
   kpi("Net profit",inr(ms.net),ms.count?"per booking "+inr(ms.net/ms.count):"—",ms.net<0?"alert":"")+
   kpi("Money received",inr(recv0),"Cash "+inr(recvCash)+" · Online "+inr(recv0-recvCash),"money")+

  (()=>{const tot={};let n=0;list(B()).forEach(b=>payList(b).forEach(x=>{if((x.date||"").slice(0,7)===ym&&x.mode!=="Transfer"){const k=x.mode||"Not noted";tot[k]=(tot[k]||0)+N(x.amount);n++}}));
    list(C()).forEach(c=>(c.adv||[]).forEach(x=>{if((x.date||"").slice(0,7)===ym&&x.mode!=="Transfer"){const k=x.mode||"Not noted";tot[k]=(tot[k]||0)+N(x.amount);n++}}));
    const outs=moneyFlows().filter(f=>(f.date||"").slice(0,7)===ym&&f.amt<0&&f.src!=="booking"&&f.kind!=="petty").sort((a,b)=>a.date<b.date?-1:1);
    const cbIn=moneyFlows().filter(f=>(f.date||"").slice(0,7)===ym&&f.amt>0&&f.src==="cashbook");const MB=moneyBal();
    const cash=tot.Cash||0,nn=tot["Not noted"]||0,online=Object.keys(tot).filter(k=>k!=="Cash"&&k!=="Not noted").reduce((a,k)=>a+tot[k],0),all=cash+online+nn;
    const exCash=-outs.filter(f=>f.kind==="cash").reduce((a,f)=>a+f.amt,0),exOn=-outs.filter(f=>f.kind==="online").reduce((a,f)=>a+f.amt,0);
    const part=(lbl,amt,sub,cls)=>'<div class="calc mr '+cls+'"><span class="label">'+lbl+'</span><b class="num" style="font-size:22px">'+inr(amt)+'</b><span class="small muted">'+sub+'</span></div>';
    return '<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Money received · '+MONF[m-1]+'</h3><span class="muted small">'+n+' payments · total '+inr(all)+'</span></div><div class="panel-b">'+

     part("Online (UPI / card / bank)",online,(all?Math.round(online/all*100):0)+"% · paid out / moved "+inr(exOn)+" · <b>in bank now "+inr(MB.online)+"</b>","mr-on")+
     (nn?'<div class="calc mr"><span class="label">Mode not noted</span><b class="num" style="font-size:22px">'+inr(nn)+'</b><span class="small muted">Older entries saved before Cash/UPI was added. Choose how they were paid:</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><button type="button" class="btn sm" data-fixmode="UPI">Mark as Online (UPI)</button><button type="button" class="btn sm" data-fixmode="Cash">Mark as Cash</button></div></div>':"")+'</div>'+
     (Object.keys(tot).filter(k=>k!=="Cash"&&k!=="Not noted").length>1?'<div class="small muted" style="margin-top:8px">Online split: '+Object.keys(tot).filter(k=>k!=="Cash"&&k!=="Not noted").map(k=>esc(k)+" "+inr(tot[k])).join(" · ")+'</div>':"")+
     '<p class="small muted" style="margin:10px 0 0">Match <b>in drawer now</b> with the cash in your galla and <b>in bank now</b> with your UPI / bank app. These are the same as the Day book.'+(MB.petty?' Petty cash box: <b>'+inr(MB.petty)+'</b>.':"")+'</p>'+(outs.length?'<div class="label" style="margin:12px 0 6px">Paid out this month</div><div class="paidout">'+outs.map(f=>'<div class="ln"><span class="small">'+fd(f.date)+' · '+esc(f.txt)+' <span class="pill '+(f.kind==="cash"?"p-gold":f.kind==="online"?"p-info":"p-mute")+'">'+esc(f.mode||"mode not noted")+'</span></span><span class="num neg">−'+inr(-f.amt)+'</span></div>').join("")+'</div>':"")+'</div></div>'})()+
  '<div class="grid cols-2" style="margin-bottom:16px">'+
   '<div class="panel"><div class="panel-h"><h3>Last 6 months</h3><span class="small"><span class="pill p-gold">Revenue</span> <span class="pill p-ok">Profit</span></span></div><div class="panel-b chart">'+svg+'</div></div>'+

const stack=[];
function modal(o){

  $("#modals").appendChild(el);
  const rec={el,o,dirty:false};stack.push(rec);
  paintModal(rec);
  el.addEventListener("click",e=>{if(e.target===el)userClose()});
  const mark=e=>{const t=e.target;if(!t||!t.matches||!t.matches("input,select,textarea"))return;if(t.type==="search"||t.closest("[data-nodirty]"))return;if(!el.querySelector(".sheet-f [data-ok],.sheet-f [data-save],.sheet-f [data-draft]"))return;rec.dirty=true};
  el.addEventListener("input",mark);el.addEventListener("change",mark);
  el.addEventListener("click",e=>{if(e.target.closest(".sheet-b [data-mode],.sheet-b [data-rm],.sheet-b #b_add"))mark({target:el.querySelector(".sheet-b input:not([type=search]),.sheet-b select")||{}})});
  document.body.style.overflow="hidden";
  if(o.onOpen)o.onOpen(el);
  const fi=el.querySelector(".sheet-b input:not([type=checkbox]):not([type=file]),.sheet-b select");if(fi&&o.autofocus!==false&&window.innerWidth>760)setTimeout(()=>fi.focus(),60);
  return el;
}
function paintModal(rec){
  const {el,o}=rec;
  el.querySelector(".sheet-h h2").innerHTML=typeof o.titleHtml==="function"?o.titleHtml():esc(o.title);
  el.querySelector(".sheet-b").innerHTML=typeof o.body==="function"?o.body():o.body;
  const f=el.querySelector(".sheet-f");if(f)f.innerHTML=typeof o.foot==="function"?o.foot():o.foot;
}
function refreshModals(){stack.forEach(r=>{if(r.o.live){const sb=r.el.querySelector(".sheet-b");const sc=sb.scrollTop;const fa=document.activeElement&&sb.contains(document.activeElement)&&document.activeElement.id?document.activeElement.id:null;setTimeout(()=>{if(fa){const x=document.getElementById(fa);if(x&&x!==document.activeElement){x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(e){}}}},0);if(r.o.exists&&!r.o.exists()){return}paintModal(r);sb.scrollTop=sc}})}
function closeTop(){const r=stack.pop();if(r)r.el.remove();if(!stack.length)document.body.style.overflow=""}
function closeAll(){while(stack.length)closeTop()}
const anyDirty=()=>stack.some(r=>r.dirty)||G.pageDirty;
let closing=false;
async function userClose(){
  const r=stack[stack.length-1];if(!r)return;
  if(pendingConfirm&&pendingConfirm.el===r.el){const pc=pendingConfirm;closeTop();pc.res(false);return}
  if(closing)return;
  if(r.dirty){closing=true;try{const ok=await askConfirm("You have filled in details that are not saved yet. Close and lose them?","Yes, discard",true,"Discard unsaved details?");if(!ok)return}finally{closing=false}if(stack[stack.length-1]!==r)return}
  closeTop();

let pendingConfirm=null;
function askConfirm(msg,yes,danger,title){
  return new Promise(res0=>{
    const res=v=>{if(pendingConfirm&&pendingConfirm.res===res)pendingConfirm=null;res0(v)};
    const el=modal({title:title||"Are you sure?",body:'<p style="margin:0">'+msg+'</p>',foot:'<button type="button" class="btn" data-c="0">No</button><button type="button" class="btn '+(danger?"danger":"pri")+'" data-c="1">'+esc(yes)+'</button>',autofocus:false});
    el.querySelectorAll("[data-c]").forEach(b=>b.addEventListener("click",()=>{closeTop();res(b.dataset.c==="1")}));
    el.querySelector("[data-close]").addEventListener("click",()=>res(false),{once:true});

/* ---------- 4-digit PIN for editing confirmed bookings ---------- */
function pinHash(p){let h=2166136261;const t="drk|"+p+"|pin";for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16)}

const PINS={fail:0,until:0};
function askPin(title,msg,opt){opt=opt||{};
  return new Promise(res0=>{
    const res=v=>{if(pendingConfirm&&pendingConfirm.res===res)pendingConfirm=null;res0(v===false?null:v)};
    const el=modal({title,autofocus:false,body:'<p style="margin:0 0 4px">'+msg+'</p><input id="pin_in" class="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="4-digit PIN" placeholder="••••"><div class="pin-err small neg" id="pin_err" aria-live="polite"></div>'+(opt.forgot?'<button type="button" class="linkbtn small" data-pin-forgot>Forgot PIN?</button>':""),
      foot:'<button type="button" class="btn" data-c="0">Cancel</button><button type="button" class="btn pri" data-c="1">'+esc(opt.yes||"Unlock")+'</button>'});
    const inp=el.querySelector("#pin_in"),err=el.querySelector("#pin_err");
    const go=()=>{const v=inp.value.replace(/\D/g,"");if(v.length!==4){err.textContent="Enter all 4 digits";inp.focus();return}
      if(opt.check){const m=opt.check(v);if(m){err.textContent=m;inp.value="";inp.focus();return}}closeTop();res(v)};
    inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,4);err.textContent="";if(inp.value.length===4)setTimeout(go,80)});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
    el.querySelector('[data-c="1"]').addEventListener("click",go);
    el.querySelector('[data-c="0"]').addEventListener("click",()=>{closeTop();res(null)});
    const fg=el.querySelector("[data-pin-forgot]");if(fg)fg.addEventListener("click",()=>{closeTop();res("forgot")});
    el.querySelector("[data-close]").addEventListener("click",()=>res(null),{once:true});
    el.addEventListener("click",e=>{if(e.target===el)res(null)});
    pendingConfirm={el,res};setTimeout(()=>inp.focus(),60);
  });
}
async function newPinFlow(title){
  const a=await askPin(title||"Set a 4-digit PIN","Choose a 4-digit PIN. It will be asked when the app opens and when someone edits a confirmed booking.",{yes:"Next"});if(!a)return false;
  const b=await askPin("Confirm the PIN","Enter the same 4 digits again.",{yes:"Save PIN",check:v=>v!==a?"PINs do not match. Try again.":""});if(!b)return false;
  try{await savePin(a);toast("PIN saved")}catch(e){return false}return true;
}
async function forgotPin(){
  if(S.mode==="cloud"&&window.firebase&&firebase.auth().currentUser){
    if(!await askConfirm("To reset the PIN, confirm your account <b>"+esc(firebase.auth().currentUser.email||"")+"</b> again"+(S.user&&S.user.google?" with Google":" with its password")+".","Continue",false,"Reset the PIN"))return false;
    if(!await reauthUser())return false;PINS.fail=0;PINS.until=0;return await newPinFlow("Set a new PIN")}
  const st=ST(),ph=String(st.phone||"").replace(/\D/g,"").slice(-10);
  const el=modal({title:"Reset the PIN",autofocus:false,body:'<p style="margin:0">'+(ph?"To reset, type the <b>shop phone number</b> saved in Settings.":"To reset, type <b>RESET</b> in capital letters.")+'</p><div class="f"><input id="fp_in" autocomplete="off" '+(ph?'inputmode="numeric"':"")+'></div><div class="small neg" id="fp_err"></div>',
    foot:'<button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn pri" data-ok>Reset PIN</button>'});
  setTimeout(()=>el.querySelector("#fp_in").focus(),60);
  return new Promise(res=>{let done=false;
    el.querySelector("[data-ok]").addEventListener("click",async()=>{const v=val(el,"fp_in");const ok=ph?v.replace(/\D/g,"").slice(-10)===ph:v==="RESET";
      if(!ok){el.querySelector("#fp_err").textContent=ph?"That is not the shop phone number.":"Type RESET exactly.";return}
      done=true;closeTop();PINS.fail=0;PINS.until=0;res(await newPinFlow("Set a new PIN"))});
    el.querySelector("[data-close]").addEventListener("click",()=>{if(!done)res(false)},{once:true});
  });
}
async function needPin(what){
  if(!pinOn()){toast("Set a PIN first to protect booking edits");return await newPinFlow("Set a PIN for booking edits")}
  for(;;){
    if(Date.now()<PINS.until){toast("Too many wrong tries. Wait "+Math.ceil((PINS.until-Date.now())/1000)+" seconds.","bad");return false}
    const v=await askPin("Enter PIN",(what||"Editing a confirmed booking needs the 4-digit PIN.")+(PINS.fail?' <span class="neg">Wrong PIN, '+(5-PINS.fail)+' tries left.</span>':""),{forgot:true});
    if(v===null)return false;
    if(v==="forgot")return await forgotPin();
    if(pinHash(v)===ST().editPin){PINS.fail=0;return true}
    PINS.fail++;if(PINS.fail>=5){PINS.fail=0;PINS.until=Date.now()+60000;toast("5 wrong tries. PIN locked for 1 minute.","bad");return false}
  }
}

  p.upis.forEach(u=>L.push("UPI: "+u.id+(u.name?" ("+u.name+")":"")+(u.bank?" · "+u.bank:"")));
  if(p.phone)L.push("UPI / GPay / PhonePe number: "+p.phone);
  p.accounts.forEach((a,i)=>{L.push("");L.push("Bank account"+(p.accounts.length>1?" "+(i+1):"")+(a.primary?" (main)":""));if(a.holder)L.push("Name: "+a.holder);if(a.bank)L.push("Bank: "+a.bank+(a.branch?", "+a.branch:""));if(a.no)L.push("A/c no: "+a.no+(a.type?" ("+a.type+")":""));if(a.ifsc)L.push("IFSC: "+a.ifsc);if(a.note)L.push(a.note)});
  return L.join("\n");
}
function cpBtn(t,lab){return '<button type="button" class="btn sm ghost cp" data-copy="'+esc(t)+'" title="Copy">'+ic("copy")+(lab||"")+'</button>'}

  return '<div class="calc pay-card"><div class="h-head"><span class="label">Payment details</span><span style="display:flex;gap:6px">'+cpBtn(payDetailsText(x),"Copy all")+(compact?"":'<button type="button" class="btn sm" data-paydet-s="'+id+'">'+ic("edit")+'Edit</button>')+'</span></div>'+
   (p.qrs.length?'<div class="qr-row">'+p.qrs.map((q,i)=>'<button type="button" class="qr-th" data-zqr="'+id+'|'+i+'" title="Open QR code"><img src="'+esc(q.img)+'" alt="QR code"><span>'+esc(q.label||"QR code")+'</span></button>').join("")+'</div>':"")+
   (p.upis.length||p.phone?'<div class="pay-rows">'+p.upis.map(u=>'<div class="pay-r"><span class="pill p-info">UPI</span><span class="pay-v mono">'+esc(u.id)+'</span><span class="small muted">'+esc([u.label||upiApp(u.id),u.name,u.bank?"Bank: "+u.bank:""].filter(Boolean).join(" · "))+'</span>'+(u.qr&&u.name?'<span class="pill p-ok" title="Name read from the seller’s UPI QR code">Name from QR</span>':"")+cpBtn(u.id)+'<a class="btn sm ghost upi-pay" href="'+esc(upiLink(u.id,u.name))+'" title="Open your UPI app (phone)">'+ic("wallet")+'Pay in UPI app</a></div>').join("")+(p.phone?'<div class="pay-r"><span class="pill p-info">UPI no.</span><span class="pay-v mono">'+esc(p.phone)+'</span><span class="small muted">GPay / PhonePe / Paytm</span>'+cpBtn(p.phone)+'</div>':"")+'</div>':"")+
   p.accounts.map((a,i)=>'<div class="bank-c'+(a.primary?" main":"")+'"><div class="bank-h"><b>'+esc(a.bank||"Bank account")+'</b>'+(a.primary?'<span class="pill p-ok">Main</span>':"")+(a.type?'<span class="pill p-mute">'+esc(a.type)+'</span>':"")+'</div>'+
     '<dl class="bank-dl">'+(a.holder?'<div><dt>Account name</dt><dd>'+esc(a.holder)+'</dd></div>':"")+(a.no?'<div><dt>Account no.</dt><dd class="mono">'+esc(a.no)+' '+cpBtn(a.no)+'</dd></div>':"")+(a.ifsc?'<div><dt>IFSC</dt><dd class="mono">'+esc(a.ifsc)+' '+cpBtn(a.ifsc)+'</dd></div>':"")+(a.branch?'<div><dt>Branch</dt><dd>'+esc(a.branch)+'</dd></div>':"")+'</dl>'+(a.note?'<div class="small muted">'+esc(a.note)+'</div>':"")+'</div>').join("")+
   (p.pref||N(p.creditDays)||N(p.creditLimit)||p.pan?'<div class="pay-terms small">'+[p.pref?"Prefers: <b>"+esc(p.pref)+"</b>":"",N(p.creditDays)?"Credit: <b>"+N(p.creditDays)+" days</b>":"",N(p.creditLimit)?"Credit limit: <b>"+inr(p.creditLimit)+"</b>":"",p.pan?"PAN: <b class=\"mono\">"+esc(p.pan)+"</b>":""].filter(Boolean).join(" · ")+'</div>':"")+'</div>';

  el.addEventListener("click",e=>{const a=e.target.closest("[data-pdadd]"),r=e.target.closest("[data-pdrm]");

    const accs=st.accounts.map(a=>({holder:String(a.holder||"").trim(),bank:String(a.bank||"").trim(),branch:String(a.branch||"").trim(),no:String(a.no||"").replace(/\s/g,""),no2:String(a.no2||"").replace(/\s/g,""),ifsc:String(a.ifsc||"").toUpperCase().trim(),type:a.type||"Current",primary:!!a.primary,note:String(a.note||"").trim()})).filter(a=>a.no||a.ifsc||a.holder||a.note);
    for(const a of accs){
      if(a.no&&a.no2!==a.no){toast("Account numbers do not match for "+(a.holder||a.bank||"a bank account")+". Re-enter it.","bad");return}
      if(a.no&&!/^\d{6,18}$/.test(a.no)){toast("Account number should be 6–18 digits","bad");return}
      if(a.ifsc&&!ifscOk(a.ifsc)&&!await askConfirm("IFSC "+a.ifsc+" does not look right. Save anyway?","Yes, save"))return;
      delete a.no2;
    }
    if(accs.length&&!accs.some(a=>a.primary))accs[0].primary=true;
    const pan=val(el,"pd_pan").toUpperCase();

  });

/* ---------- buying-trip helpers: similar-stock check + quick add ---------- */
const COLGRP=[["maroon","wine","burgundy","mehroon"],["red","laal"],["pink","rani","magenta","baby pink","gulabi","fuchsia"],["peach","coral","salmon"],["yellow","mustard","haldi","lemon"],["gold","golden","copper"],["orange","rust","kesariya"],["green","mint","olive","pista","bottle green","mehendi","sea green"],["blue","navy","sky","firozi","teal","turquoise","royal blue"],["purple","lavender","violet","mauve","onion"],["white","off white","cream","ivory","beige"],["black"],["grey","gray","silver"],["brown","coffee","chocolate"],["multi","multicolour","multicolor"]];
const QCOL=["Maroon","Red","Pink","Peach","Yellow","Gold","Orange","Green","Blue","Purple","White","Black","Grey","Multi"];
function colGroups(c){c=String(c||"").toLowerCase();const g=[];COLGRP.forEach((w,i)=>{if(w.some(x=>c.includes(x)))g.push(i)});return g}
function colMatch(a,b){a=String(a||"").toLowerCase().trim();b=String(b||"").toLowerCase().trim();if(!a||!b)return false;if(a.includes(b)||b.includes(a))return true;const ga=colGroups(a),gb=colGroups(b);return ga.some(x=>gb.includes(x))}
function similarStock(cat,color){return list(D()).filter(d=>d.status!=="sold"&&d.status!=="retired"&&(!cat||d.category===cat)&&(!color||colMatch(d.color,color)))}
function tripPicks(exceptOrderId){const out=[];list(OR()).forEach(o=>{if(o.id===exceptOrderId)return;const c=poCalc(o);if(c.status!=="ordered"&&c.status!=="partial"&&c.status!=="draft")return;(o.lines||[]).forEach(l=>{if(N(l.qty)-N(l.got)-N(l.rej)>0)out.push({desc:l.desc,cat:l.cat,color:l.color,photo:l.photo,rate:l.rate,src:o.no+" · "+((SL()[o.sellerId]||{}).name||"")})})});return out}
function stockCard(d){return '<button type="button" class="sc-card" data-open-d="'+d.id+'"><div class="sc-ph">'+(d.photo?'<img src="'+esc(d.photo)+'" alt="" loading="lazy">':'<div class="ph-pattern"></div><span>'+esc((d.category||"D").charAt(0))+'</span>')+'</div><div class="sc-t"><span class="mono">'+esc(d.code)+'</span> '+esc(d.name)+'</div><div class="sc-s">'+esc([d.color,d.size].filter(Boolean).join(" · "))+'</div></button>'}
function pickCard(x){return '<div class="sc-card pick"><div class="sc-ph">'+(x.photo?'<img src="'+esc(x.photo)+'" alt="">':'<div class="ph-pattern"></div><span>'+esc((x.cat||"D").charAt(0))+'</span>')+'</div><div class="sc-t">'+esc(x.desc||"Design")+'</div><div class="sc-s">'+esc([x.color,x.rate?inr(x.rate):"",x.src].filter(Boolean).join(" · "))+'</div></div>'}
function stockCheckModal(o){
  o=o||{};const st={cat:o.cat||"",color:o.color||""};
  const el=modal({title:"Do I already have this?",wide:true,live:true,autofocus:false,body:()=>{
    const ds=similarStock(st.cat,st.color).sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
    const cur=(o.current&&o.current())||[],trip=tripPicks(o.orderId).filter(x=>(!st.cat||x.cat===st.cat)&&(!st.color||colMatch(x.color,st.color)));
    const curF=cur.filter(x=>(!st.cat||x.cat===st.cat)&&(!st.color||colMatch(x.color,st.color)));
    return '<div class="fgrid"><div class="f"><label for="sc_cat">Category</label><select id="sc_cat"><option value="">All categories</option>'+CATS.map(c=>'<option'+(st.cat===c?" selected":"")+'>'+c+'</option>').join("")+'</select></div><div class="f"><label for="sc_col">Colour</label><input id="sc_col" value="'+esc(st.color)+'" placeholder="any colour"></div></div>'+
     '<div class="chips">'+QCOL.map(c=>'<button type="button" class="chip'+(st.color.toLowerCase()===c.toLowerCase()?" on":"")+'" data-sccol="'+c+'"><i style="background:'+colSwatch(c)+'"></i>'+c+'</button>').join("")+(st.color?'<button type="button" class="chip" data-sccol="">Any</button>':"")+'</div>'+

function moneyFlows(){
  const st=ST(),from=st.openDate||"",F=[];
  const add=(date,amt,mode,src,txt)=>{if(!date||(from&&date<from))return;F.push({date,amt:N(amt),kind:modeKind(mode),mode,src,txt})};
  list(C()).forEach(c=>(c.adv||[]).forEach(x=>x.mode!=="Transfer"&&add(x.date,N(x.amount),x.mode,"booking",(N(x.amount)<0?"Advance returned · ":"Advance · ")+(c.name||""))));
  list(B()).forEach(b=>payList(b).forEach(x=>x.mode!=="Transfer"&&add(x.date,N(x.amount),x.mode,"booking",(N(x.amount)<0?"Refund ":"Received ")+BN(b.no))));
  list(E()).forEach(e=>add(e.date,-N(e.amount),e.mode,"expense",e.cat));
  list(SL()).forEach(x=>(x.payments||[]).forEach(p=>add(p.date,-N(p.amount),p.mode,"seller","Paid "+x.name)));
  list(OR()).forEach(o=>(o.freightPays||[]).forEach(p=>add(p.date,-N(p.amount),p.mode,"freight","Bhada "+o.no)));
  list(CL()).forEach(bt=>(bt.charges||[]).forEach(c=>{if(c.paid)add(c.paidOn||c.date,-N(c.amount),c.mode,"cleaning",(clKind(bt)==="repair"?"Repair":"Dry-cleaning")+" · "+(bt.cleaner||"")+" · "+bt.no)}));
  list(P()).forEach(x=>(x.payouts||[]).forEach(p=>add(p.date,-N(p.amount),p.mode||"","payout","Commission "+x.name)));
  list(CB()).forEach(c=>{
    if(c.type==="deposit"){add(c.date,-N(c.amount),"Cash","cashbook","Cash deposited to bank");add(c.date,N(c.amount),"Bank transfer","cashbook","Cash deposited to bank")}
    else if(c.type==="withdraw"){add(c.date,-N(c.amount),"Bank transfer","cashbook","Withdrawn from bank");add(c.date,N(c.amount),"Cash","cashbook","Withdrawn from bank")}
    else if(c.type==="add")add(c.date,N(c.amount),c.where==="cash"?"Cash":"Bank transfer","cashbook","Owner added money");
    else if(c.type==="take")add(c.date,-N(c.amount),c.where==="cash"?"Cash":"Bank transfer","cashbook","Owner took money");
    else if(c.type==="petty"){if(c.from!=="owner")add(c.date,-N(c.amount),"Cash","cashbook","Moved to petty cash");add(c.date,N(c.amount),PETTYM,"cashbook",c.from==="owner"?"Petty cash added by owner":"Petty cash filled from galla")}

  });
  return F;
}

const OR=()=>S.data.orders||{};
const OST={draft:["Draft","p-mute"],ordered:["Ordered","p-info"],dispatched:["Dispatched","p-acc"],partial:["Part received","p-warn"],received:["Received","p-ok"],cancelled:["Cancelled","p-bad"]};
function poCalc(o){
  const L=(o.lines||[]).map(l=>Object.assign({},l,{qty:N(l.qty),rate:N(l.rate),got:N(l.got),rej:N(l.rej)}));
  const items=L.reduce((a,l)=>a+l.qty*l.rate,0),pcs=L.reduce((a,l)=>a+l.qty,0),got=L.reduce((a,l)=>a+l.got,0),rej=L.reduce((a,l)=>a+l.rej,0);
  const disc=N(o.discount),other=N(o.other),packing=N(o.packing),freight=N(o.freight);
  const freightToSeller=o.freightTo==="seller";
  const sellerCharges=other+packing+(freightToSeller?freight:0);
  const charges=other+packing+freight;
  const total=Math.max(0,items-disc+sellerCharges);
  const discPct=items?disc/items:0;
  const rejValue=L.reduce((a,l)=>a+l.rej*l.rate,0);const payable=Math.max(0,total-rejValue*(1-discPct));
  const recvValue=L.reduce((a,l)=>a+l.got*l.rate,0);
  const sellerRecvValue=recvValue*(1-discPct)+(pcs?sellerCharges*got/pcs:0);
  const extraPerPc=pcs?(other+packing+freight)/pcs:0;
  const paid=list(SL()).reduce((a,x)=>a+(x.payments||[]).filter(p=>p.poId===o.id).reduce((q,p)=>q+N(p.amount),0),0);
  const pending=Math.max(0,pcs-got-rej);
  const disp=o.dispatch&&o.dispatch.date;
  let status=o.status==="cancelled"?"cancelled":o.status==="draft"?"draft":(got+rej>=pcs&&pcs>0?"received":got+rej>0?"partial":disp?"dispatched":"ordered");
  const due=(o.dispatch&&o.dispatch.eta)||o.expDate;
  const late=(status==="ordered"||status==="dispatched"||status==="partial")&&due&&due<today();
  return {L,items,pcs,got,rej,pending,charges,other,packing,freight,freightToSeller,disc,sellerCharges,total,rejValue,payable,recvValue,sellerRecvValue,extraPerPc,discPct,paid,balance:payable-paid,status,late,due};
}

/* per-piece share of order charges for a dress that came from an order */
function poShare(d){
  const o=d&&d.poId&&OR()[d.poId];if(!o)return null;const c=poCalc(Object.assign({id:d.poId},o));if(!c.pcs)return null;
  const r=v=>Math.round(v/c.pcs);const parts=[];
  if(c.other)parts.push([o.otherLabel||"Other charges",r(c.other)]);if(N(o.packing))parts.push(["Packing",r(N(o.packing))]);
  if(c.freight)parts.push(["Transport bhada",r(c.freight)]);
  return {parts,pcs:c.pcs,no:o.no,disc:c.disc?Math.round(c.disc/c.pcs):0};
}
function extraLabel(d){const sh=poShare(d);if(!sh||!sh.parts.length)return "+"+inr(d.extra)+" transport";return "+"+inr(d.extra)+" ("+sh.parts.map(p=>p[0].replace(/ \(.*\)/,"")+" "+inr(p[1])).join(" + ")+")"}

/* reusable "Paid to" picker for a seller (QR / UPI / bank cards) */
function sellerPayOpts(sid){
  const x=SL()[sid];if(!x)return [];const pi=payInfo(x),opts=[];
  pi.upis.forEach(u=>{const qrs=pi.qrs.map((q,qi)=>({q,qi})).filter(z=>z.q.upi&&z.q.upi.toLowerCase()===u.id.toLowerCase());opts.push({t:"UPI",v:"UPI "+u.id,title:u.id,sub:[u.label||upiApp(u.id),u.name,u.bank?"Bank: "+u.bank:""].filter(Boolean).join(" · "),qrs,copy:u.id,link:upiLink(u.id,u.name),fromQr:u.qr&&u.name})});
  const used=new Set(opts.flatMap(o=>o.qrs.map(z=>z.qi)));
  pi.qrs.forEach((q,qi)=>{if(used.has(qi))return;opts.push({t:"UPI",v:"QR "+(q.label||"code")+(q.upi?" ("+q.upi+")":""),title:q.label||"QR code",sub:q.upi?q.upi+(q.name?" · "+q.name:""):"Scan to pay",qrs:[{q,qi}],copy:q.upi||""})});
  if(pi.phone)opts.push({t:"UPI",v:"UPI number "+pi.phone,title:pi.phone,sub:"UPI number (GPay / PhonePe / Paytm)",qrs:[],copy:pi.phone});
  pi.accounts.forEach(a=>{if(!a.no&&!a.ifsc)return;opts.push({t:"Bank",v:(a.bank||"Bank")+" "+maskAc(a.no)+(a.ifsc?" · "+a.ifsc:""),title:(a.bank||"Bank account"),sub:[a.holder,a.type,a.branch].filter(Boolean).join(" · "),acc:a,qrs:[]})});
  return opts;
}

/* mounts into #boxId, keeps "Paid by" (modeId) in sync; returns {to()} */
function mountPayPick(el,boxId,modeId,getSid,onChange){
  let sid=null,opts=[],pick=-1;
  const firstOf=t=>opts.findIndex(o=>o.t===t);
  const setMode=m=>{const b=el.querySelector('[data-modegrp="'+modeId+'"] [data-mode="'+m+'"]');if(b&&val(el,modeId)!==m)b.click()};
  const paint=()=>{const bx=el.querySelector("#"+boxId);if(!bx)return;
    bx.querySelectorAll("[data-pp]").forEach(n=>{const on=+n.dataset.pp===pick;n.classList.toggle("on",on);n.setAttribute("aria-checked",String(on))});
    const h=bx.querySelector(".pp-h");if(h)h.textContent=pick>=0?"Paying to: "+opts[pick].v:(val(el,modeId)==="Cash"?"Cash payment: no account needed.":"Tap where you are sending the money.")};
  const render=()=>{const bx=el.querySelector("#"+boxId);if(!bx)return;sid=getSid();opts=sellerPayOpts(sid);
    if(!SL()[sid]){bx.innerHTML="";pick=-1;return}
    if(!opts.length){bx.innerHTML='<div class="small muted">No UPI / QR / bank details saved for this seller. <button type="button" class="linkish" data-paydet-s="'+sid+'">Add payment details</button></div>';pick=-1;return}
    const pref=(payInfo(SL()[sid]).pref)||"";const m=val(el,modeId);
    if(m==="Cash")pick=-1;else if(m==="Bank transfer")pick=firstOf("Bank")>=0?firstOf("Bank"):firstOf("UPI");else pick=firstOf("UPI")>=0?firstOf("UPI"):firstOf("Bank");
    if(pick>=0&&m!=="Cash")setMode(opts[pick].t==="Bank"?"Bank transfer":"UPI");
    bx.innerHTML='<label style="font-size:13px;font-weight:700">Pay to <span class="muted" style="font-weight:500">· '+esc(SL()[sid].name)+'</span></label><div class="pp-list">'+opts.map((o,k)=>ppOptHTML(sid,o,k)).join("")+'</div><span class="hint pp-h"></span>';paint()};
  el.addEventListener("click",e=>{const bx=el.querySelector("#"+boxId);if(!bx)return;
    if(e.target.closest("[data-zqr],[data-copy],.upi-pay"))return;
    const o=e.target.closest("[data-pp]");
    if(o&&bx.contains(o)){const k=+o.dataset.pp;pick=pick===k&&opts.length>1?-1:k;if(pick>=0)setMode(opts[pick].t==="Bank"?"Bank transfer":"UPI");paint();if(onChange)onChange();return}
    const mb=e.target.closest('[data-modegrp="'+modeId+'"] [data-mode]');
    if(mb)setTimeout(()=>{const m=val(el,modeId);if(m==="Cash")pick=-1;else if(m==="UPI"&&(pick<0||opts[pick].t!=="UPI"))pick=firstOf("UPI");else if(m==="Bank transfer"&&(pick<0||opts[pick].t!=="Bank"))pick=firstOf("Bank");paint();if(onChange)onChange()},0);
  });
  render();
  return {render,to:()=>val(el,modeId)==="Cash"||pick<0?"":opts[pick].v};
}

function freightPaidSum(o){return (o.freightPays||[]).reduce((a,x)=>a+N(x.amount),0)}

   '<div class="f"><label>Bhada paid to</label><div class="seg" data-frto="'+pf+'"><button type="button" data-v="transporter" class="'+(to==="transporter"?"on":"")+'">Transporter (separately)</button><button type="button" data-v="seller" class="'+(to==="seller"?"on":"")+'">In seller’s bill</button></div><input type="hidden" id="'+pf+'_to" value="'+to+'"></div>'+
   '<div class="f full" id="'+pf+'_payw"'+(to==="seller"?" hidden":"")+'>'+
     (paidSoFar?'<div class="okbox" style="margin:0 0 8px" id="'+pf+'_paidok"><b>✓ Bhada already paid to transporter: '+inr(paidSoFar)+'</b><div class="small">'+esc(paidTxt)+'</div></div>':"")+
     '<div id="'+pf+'_askw"><label id="'+pf+'_asklab">Bhada paid now?</label><div class="seg" data-frpaid="'+pf+'"><button type="button" data-v="later" class="on">Pay later / at delivery</button><button type="button" data-v="now">Paid now</button></div><input type="hidden" id="'+pf+'_pd" value="later"><div id="'+pf+'_modew" hidden style="margin-top:8px">'+modeSel(pf+"_mode","Cash")+'</div></div>'+

   '<p class="small muted" style="margin:0">Bhada is split equally over all pieces of this order and added to each dress’s cost. Paid to the transporter, it does not change what you owe the seller.</p>';
}
function wireFreight(el,pf){
  const sync=()=>{const fi=el.querySelector("#"+pf+"_fr");if(!fi)return;const paid=N(fi.dataset.paid),fr=N(fi.value),left=fr-paid;
    const ask=el.querySelector("#"+pf+"_askw"),lab=el.querySelector("#"+pf+"_asklab"),ov=el.querySelector("#"+pf+"_over");
    ask.hidden=!(left>0.5);lab.textContent=paid?"Remaining "+inr(left)+" paid now?":"Bhada paid now?";
    ov.innerHTML=paid&&fr&&fr<paid-0.5?'<span class="warn-t">You already paid '+inr(paid)+', more than '+inr(fr)+'. Keep the amount at '+inr(paid)+' unless the transporter returned money.</span>':(paid&&left<=0.5&&fr?'<span class="pos">Nothing more to pay.</span>':"");
    if(ask.hidden){el.querySelector("#"+pf+"_pd").value="later"}};
  el.addEventListener("input",e=>{if(e.target.id===pf+"_fr")sync()});
  el.addEventListener("click",e=>{const u=e.target.closest('[data-frunlock="'+pf+'"]');if(u){el.querySelector("#"+pf+"_lock").hidden=true;el.querySelector("#"+pf+"_edit").hidden=false;setTimeout(()=>el.querySelector("#"+pf+"_fr").focus(),30);return}
    const a=e.target.closest('[data-frto="'+pf+'"] [data-v]'),b=e.target.closest('[data-frpaid="'+pf+'"] [data-v]');
    if(a){a.parentNode.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===a));el.querySelector("#"+pf+"_to").value=a.dataset.v;el.querySelector("#"+pf+"_payw").hidden=a.dataset.v==="seller"}
    if(b){b.parentNode.querySelectorAll("[data-v]").forEach(x=>x.classList.toggle("on",x===b));el.querySelector("#"+pf+"_pd").value=b.dataset.v;el.querySelector("#"+pf+"_modew").hidden=b.dataset.v!=="now"}});
  sync();
}
function readFreight(el,pf,o,on){
  const fr=N(val(el,pf+"_fr")),to=val(el,pf+"_to")||"transporter",now=val(el,pf+"_pd")==="now";
  const o2={freight:fr,freightTo:to,freightPays:(o.freightPays||[]).slice()};const msg=[];
  if(fr!==N(o.freight)||to!==(o.freightTo||"transporter"))msg.push("bhada "+inr(fr)+(to==="seller"?" (in seller bill)":" (to transporter)"));
  if(to==="transporter"&&now){const left=Math.max(0,fr-freightPaidSum(o));if(left>0){const mo=modeVal(el,pf+"_mode");o2.freightPays.push({amount:left,date:on||today(),mode:mo.mode,ref:mo.ref,at:Date.now()});msg.push("bhada "+inr(left)+" paid ("+mo.mode+")")}}
  return {o2,msg};
}

/* booking no. B-2026/01 and invoice no. INV-2026/01: count restarts every year */
function yrNext(pre,vals){const y=today().slice(0,4),re=new RegExp("^#?"+pre+"-"+y+"/(\\d+)$");let mx=0;vals.forEach(v=>{const m=String(v||"").trim().match(re);if(m)mx=Math.max(mx,+m[1])});return pre+"-"+y+"/"+String(mx+1).padStart(2,"0")}
function nextNo(){return yrNext("B",list(B()).map(b=>b.no).concat(Object.values(S.data.deleted||{}).map(b=>b&&b.no)))}
const fsafe=x=>String(x||"").replace(/^#/,"").replace(/[\/\\]+/g,"-");
function altDates(dids,from,to,ev,exceptId){if(!ev||!(from<=ev&&ev<=to))return null;const ok=(a,c)=>dids.every(x=>!clashes(x,a,c,exceptId).length);
  for(let a=from;a<=ev;a=addDays(a,1)){for(let c=to;c>=ev&&c>=a;c=addDays(c,-1)){if(ok(a,c))return [a,c]}}return null}

/* measurements + fitting (done in the shop from the customer's size; no trial visit) */
const MEAS=[["bust","Chest / bust"],["waist","Waist"],["hip","Hip"],["length","Lehenga length"],["blouse","Blouse size"],["height","Height"]];

  const id=e.target.id;

  if(id==="cl_add"&&e.target.value){const did=e.target.value,d=D()[did],sec=e.target.dataset.sec||"clean";if(d){const nb=clNextBooking(d.id);if(nb&&diff(today(),nb.deliveryDate)<=1&&!await askConfirm(d.code+" has booking "+BN(nb.no)+" on "+fd(nb.deliveryDate)+". Still send it for "+(sec==="repair"?"repair":"cleaning")+"?","Yes, send"))return;const o=clone(d);o.status=sec==="repair"?"repair":"cleaning";o.cleanSince=today();o.work={need:sec==="repair"?"repair":"clean",note:"",since:today(),manual:true};delete o.id;try{await put("dresses",did,o);toast(d.code+" added to the To give list")}catch(x){}}return}
  if(e.target.dataset&&e.target.dataset.clneed){const did=e.target.dataset.clneed,d=D()[did],v=e.target.value;if(d){const o=clone(d);delete o.id;o.status=v==="clean"?"cleaning":"repair";o.work=Object.assign({},o.work||{},{need:v});try{await put("dresses",did,o);toast(d.code+": "+NEEDT[v]+(v==="clean"?"":" · moved to the Repair list"))}catch(x){}}return}
  if(id==="restore_f"){
    const f=e.target.files[0];if(!f)return;
    try{
      const j=JSON.parse(await f.text());
      if(!j||typeof j!=="object"||!j.bookings||!j.dresses)throw 0;
      if(!await askConfirm("All current data will be replaced by this backup. Continue?","Yes, restore",true)){e.target.value="";return}
      if(S.mode==="cloud"){toast("Restoring… keep this page open");let n=0,bad=0;
        const ops=[];
        for(const c of COLS){const nw=j[c]||{};for(const k of Object.keys(S.data[c]||{}))if(!(k in nw))ops.push([c,k,null]);
          for(const [k,v] of Object.entries(nw)){if(!k||k==="undefined"||k.includes("/")||!v||typeof v!=="object")continue;let o=Object.assign({},v);delete o.id;if(c==="customers")o=safeCust(o);ops.push([c,k,o])}}
        for(let i=0;i<ops.length;i+=400){const bt=S.db.batch(),part=ops.slice(i,i+400);part.forEach(([c,k,o])=>{const r=S.db.collection(c).doc(k);if(o)bt.set(r,o);else bt.delete(r)});
          try{await bt.commit();n+=part.filter(x=>x[2]).length}catch(z){bad+=part.length}}
        toast(n+" records restored"+(bad?" · "+bad+" could not be saved":""),bad?"bad":"");e.target.value="";return}
      COLS.forEach(c=>S.data[c]=j[c]||{});Object.keys(S.data.customers).forEach(k=>S.data.customers[k]=safeCust(S.data.customers[k]));saveLocal();rerender();toast("Data restored from backup");
    }catch(x){toast("This doesn't look like a valid backup file","bad")}
    e.target.value="";return;
  }
  if(id==="dcat"){V.dcat=e.target.value;render()}
  if(id==="ecat_f"){V.ecat=e.target.value;render()}
  if(id==="emode_f"){V.emode=e.target.value;render()}
  if(id==="dstat"){V.dstat=e.target.value;render()}
});

/* ---------- leave guard: back / forward / close need permission ---------- */
const G={armed:false,leaving:false,busy:false};
const guardOn=()=>ST().guard!==false;
function arm(){if(G.leaving||!guardOn())return;if(G.repush&&history.state&&history.state.g===1){try{history.pushState({g:1},"")}catch(e){}G.repush=false}if(!history.state||history.state.g!==1){try{if(!history.state||history.state.g!==0)history.replaceState({g:0},"");history.pushState({g:1},"")}catch(e){}}G.armed=true}
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,arm,{capture:true,passive:true}));
window.addEventListener("beforeunload",e=>{if(G.leaving)return;if(!guardOn()&&!anyDirty())return;e.preventDefault();e.returnValue=""});
const VNAME=Object.assign(Object.fromEntries(NAV.map(n=>[n[0],n[1]])),{calendar:"Calendar"});
window.addEventListener("popstate",async()=>{
  if(G.leaving||!guardOn())return;
  try{history.pushState({g:1},"")}catch(e){}
  G.repush=true;
  if(pendingConfirm){const pc=pendingConfirm;pendingConfirm=null;closeTop();pc.res(false);return}
  if(G.busy)return;
  G.busy=true;
  try{
    if(stack.length){
      const top=stack[stack.length-1];
      const isForm=!!top.el.querySelector(".sheet-b input:not([type=checkbox]):not([type=file]),.sheet-b select,.sheet-b textarea");
      const ok=top.dirty?await askConfirm("You have filled in details that are not saved yet. Close and lose them?","Yes, discard",true,"Discard unsaved details?"):await askConfirm(isForm?"Close this form?":"Close this window?","Close",false,"Go back?");
      if(ok)closeTop();
      return;
    }
    const prev=(V.hist&&V.hist.length)?V.hist[V.hist.length-1]:(V.view!=="dash"?"dash":null);
    if(prev&&G.pageDirty){if(V.hist&&V.hist.length)V.hist.pop();go(prev,true);return}
    if(prev){
      const ok=await askConfirm("Leave "+VNAME[V.view]+" and go back to "+VNAME[prev]+"?","Go back",false,"Leave this page?");
      if(ok){if(V.hist&&V.hist.length)V.hist.pop();go(prev,true)}
      return;
    }
    const ok=await askConfirm("Exit the app? Your data stays saved on this device.","Exit",true,"Exit app?");
    if(ok){G.leaving=true;history.go(-2);setTimeout(()=>{if(document.visibilityState==="visible"){G.leaving=false;arm();toast("Close this tab to exit")}},700)}
  }finally{G.busy=false}
});

render();
/* laptop screens: fit the whole layout to the screen (phones/tablets stay as they are) */
function fitScreen(){const w=window.innerWidth,touch=window.matchMedia&&matchMedia("(hover:none)").matches;
  const z=(!touch&&w>=1000)?Math.max(.78,Math.min(1,w/1560)):1;document.documentElement.style.setProperty("--z",z.toFixed(3));document.documentElement.style.setProperty("--vh",(window.innerHeight/z/100).toFixed(3)+"px")}
fitScreen();window.addEventListener("resize",fitScreen);
initStore();
})();
